name: Format production readiness

on:
  push:
    branches: [agent/production-readiness]

permissions:
  contents: write

concurrency:
  group: format-production-readiness
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/production-readiness
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.1
      - name: Appliquer Ruff format
        run: ruff format .
      - name: Committer le formatage produit par Ruff
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "Aucun formatage nécessaire."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Appliquer Ruff format aux corrections"
          git push origin HEAD:agent/production-readiness
