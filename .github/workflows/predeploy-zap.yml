name: Predeploy ZAP baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predeploy-zap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: OWASP ZAP passive baseline
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/predeploy-go-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: https://iteag-preprod.137.74.169.188.sslip.io
    steps:
      - name: Scanner passivement la surface publique
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/zap"
          chmod 777 "$RUNNER_TEMP/zap"
          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/zap:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "$TARGET" \
            -T 5 \
            -s \
            -J zap-report.json \
            -w zap-report.md
          code=$?
          set -e

          echo "Code de sortie ZAP: $code"
          if [ -f "$RUNNER_TEMP/zap/zap-report.md" ]; then
            cat "$RUNNER_TEMP/zap/zap-report.md"
          fi

          # 0 = aucune alerte ; 2 = avertissements passifs à examiner.
          # 1 signifie au moins une règle configurée FAIL ; 3 une erreur du scan.
          # Les WARN sont affichés puis triés humainement : ils ne deviennent
          # jamais des exceptions silencieuses, mais évitent aussi de transformer
          # un faux positif ZAP en blocage automatique arbitraire.
          if [ "$code" -eq 1 ] || [ "$code" -eq 3 ]; then
            exit "$code"
          fi
