name: Predeploy ZAP baseline

# Le scan vise une URL de préproduction fixe. Il s'exécute uniquement après un
# push sur main (ou sur demande / planification), attend que Coolify serve le
# SHA attendu et refuse ensuite tout WARN non explicitement résolu ou qualifié.
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predeploy-zap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: OWASP ZAP passive baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET: https://iteag-preprod.137.74.169.188.sslip.io
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    steps:
      - uses: actions/checkout@v6

      - name: Prouver la révision déployée et l'hôte SEO
        shell: bash
        run: |
          set -euo pipefail
          python src/scripts/verifier_preprod_deployee.py \
            --base-url "$TARGET" \
            --revision "$GITHUB_SHA" \
            --attente 600 \
            --intervalle 15

      - name: Scanner passivement la surface publique
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/zap"
          chmod 777 "$RUNNER_TEMP/zap"
          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/zap:/zap/wrk/:rw" \
            -t "$ZAP_IMAGE" \
            zap-baseline.py \
            -t "$TARGET" \
            -T 5 \
            -s \
            -J zap-report.json \
            -w zap-report.md
          code=$?
          set -e

          echo "Code de sortie ZAP: $code"
          if [ -f "$RUNNER_TEMP/zap/zap-report.md" ]; then
            cat "$RUNNER_TEMP/zap/zap-report.md"
          fi

          # 0 = aucune alerte non qualifiée.
          # 1 = au moins une règle configurée FAIL.
          # 2 = au moins un WARN : c'est aussi un échec tant qu'il n'a pas été
          #     corrigé ou qualifié explicitement avec une preuve reproductible.
          # 3 = erreur d'exécution du scan.
          test "$code" -eq 0

      - name: Conserver le rapport ZAP brut
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-preprod-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zap/zap-report.json
            ${{ runner.temp }}/zap/zap-report.md
          if-no-files-found: error
          retention-days: 14
