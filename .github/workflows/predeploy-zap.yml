name: Predeploy ZAP baseline

# Ces contrôles s'exécutent contre la préproduction. Ils étaient gardés par le
# nom de la branche source (« agent/predeploy-go-readiness », « agent/go-live-ops-gate »).
# Ces branches ayant été fusionnées, la condition n'était plus jamais vraie :
# le contrôle existait, passait pour actif, et ne s'exécutait plus. On s'en
# remet donc à des déclencheurs qui ne dépendent d'aucun nom éphémère — toute
# PR vers main, un rendez-vous hebdomadaire, et le déclenchement manuel.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predeploy-zap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: OWASP ZAP passive baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: https://iteag-preprod.137.74.169.188.sslip.io
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    steps:
      - name: Scanner passivement la surface publique
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/zap"
          chmod 777 "$RUNNER_TEMP/zap"
          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/zap:/zap/wrk/:rw" \
            -t "$ZAP_IMAGE" \
            zap-baseline.py \
            -t "$TARGET" \
            -T 5 \
            -s \
            -J zap-report.json \
            -w zap-report.md
          code=$?
          set -e

          echo "Code de sortie ZAP: $code"
          if [ -f "$RUNNER_TEMP/zap/zap-report.md" ]; then
            cat "$RUNNER_TEMP/zap/zap-report.md"
          fi

          # 0 = aucune alerte ; 2 = avertissements passifs à examiner.
          # 1 signifie au moins une règle configurée FAIL ; 3 une erreur du scan.
          # Les WARN sont affichés puis triés humainement : ils ne deviennent
          # jamais des exceptions silencieuses, mais évitent aussi de transformer
          # un faux positif ZAP en blocage automatique arbitraire.
          if [ "$code" -eq 1 ] || [ "$code" -eq 3 ]; then
            exit "$code"
          fi
