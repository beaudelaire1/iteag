name: Predeploy Lighthouse

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predeploy-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lighthouse mobile
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/predeploy-go-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://iteag-preprod.137.74.169.188.sslip.io
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Vérifier le noindex de la connexion
        shell: bash
        run: |
          set -euo pipefail
          python - "$BASE_URL" <<'PY'
          from html.parser import HTMLParser
          import sys
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          class RobotsParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.robots = []

              def handle_starttag(self, tag, attrs):
                  if tag != "meta":
                      return
                  data = {str(cle).lower(): valeur for cle, valeur in attrs if cle}
                  if (data.get("name") or "").lower() == "robots":
                      self.robots.append((data.get("content") or "").lower())

          url = urljoin(sys.argv[1].rstrip("/") + "/", "connexion/")
          req = Request(url, headers={"User-Agent": "ITEAG-Predeploy-Audit/1.0"})
          with urlopen(req, timeout=20) as rep:
              html = rep.read().decode("utf-8", errors="replace")

          parser = RobotsParser()
          parser.feed(html)
          assert any("noindex" in contenu for contenu in parser.robots), parser.robots
          print(f"Connexion volontairement noindex: {parser.robots}")
          PY

      - name: Auditer les pages clés
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lighthouse
          declare -A pages=(
            [accueil]="/"
            [formations]="/formations/"
            [candidature]="/admissions/candidature/"
            [connexion]="/connexion/"
          )

          for nom in accueil formations candidature connexion; do
            url="${BASE_URL}${pages[$nom]}"
            echo "=== Lighthouse: ${nom} — ${url} ==="
            npx --yes lighthouse@13.4.1 "$url" \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="/tmp/lighthouse/${nom}.json"
          done

      - name: Contrôler les scores et métriques
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path

          def details_audit(audit, limite=12):
              details = audit.get("details") or {}
              items = details.get("items") or []
              sorties = []
              for item in items[:limite]:
                  node = item.get("node") or {}
                  selector = node.get("selector") or ""
                  snippet = node.get("snippet") or ""
                  if selector or snippet:
                      sorties.append(f"selector={selector!r} snippet={snippet!r}")
                      continue
                  morceaux = []
                  for cle in ("url", "source", "duration", "total", "scripting", "scriptParseCompile"):
                      if cle in item:
                          morceaux.append(f"{cle}={item[cle]!r}")
                  if morceaux:
                      sorties.append(" ".join(morceaux))
              return sorties

          echecs = []
          for chemin in sorted(Path("/tmp/lighthouse").glob("*.json")):
              data = json.loads(chemin.read_text())
              cats = data["categories"]
              audits = data["audits"]
              scores = {
                  "performance": cats["performance"]["score"],
                  "accessibilite": cats["accessibility"]["score"],
                  "bonnes_pratiques": cats["best-practices"]["score"],
                  "seo": cats["seo"]["score"],
              }
              lcp = audits.get("largest-contentful-paint", {}).get("numericValue")
              cls = audits.get("cumulative-layout-shift", {}).get("numericValue")
              tbt = audits.get("total-blocking-time", {}).get("numericValue")
              fcp = audits.get("first-contentful-paint", {}).get("numericValue")

              print(f"\n{chemin.stem.upper()}")
              for nom, score in scores.items():
                  print(f"  {nom:18}: {score * 100:.0f}")
              print(f"  FCP               : {fcp:.0f} ms" if fcp is not None else "  FCP               : n/a")
              print(f"  LCP               : {lcp:.0f} ms" if lcp is not None else "  LCP               : n/a")
              print(f"  TBT               : {tbt:.0f} ms" if tbt is not None else "  TBT               : n/a")
              print(f"  CLS               : {cls:.3f}" if cls is not None else "  CLS               : n/a")

              for categorie in ("performance", "accessibility", "best-practices", "seo"):
                  non_conformes = []
                  for reference in cats[categorie].get("auditRefs", []):
                      audit = audits.get(reference["id"], {})
                      score = audit.get("score")
                      mode = audit.get("scoreDisplayMode")
                      if score is not None and score < 1 and mode not in {"notApplicable", "informative"}:
                          non_conformes.append(
                              (
                                  reference["id"],
                                  score,
                                  audit.get("title", ""),
                                  audit.get("displayValue", ""),
                              )
                          )
                  if non_conformes:
                      print(f"  Audits {categorie} à examiner:")
                      for identifiant, score, titre, valeur in non_conformes:
                          suffixe = f" — {valeur}" if valeur else ""
                          print(f"    - {identifiant}: {score} — {titre}{suffixe}")
                          for detail in details_audit(audits.get(identifiant, {})):
                              print(f"      · {detail}")

              if chemin.stem == "accueil":
                  for identifiant in ("bootup-time", "long-tasks", "mainthread-work-breakdown", "network-requests"):
                      audit = audits.get(identifiant)
                      if not audit:
                          continue
                      print(f"  Diagnostic {identifiant}: {audit.get('displayValue', '')}")
                      for detail in details_audit(audit, limite=20):
                          print(f"    · {detail}")

              if scores["accessibilite"] < 0.95:
                  echecs.append(f"{chemin.stem}: accessibilité {scores['accessibilite']:.2f} < 0.95")
              if scores["bonnes_pratiques"] < 0.95:
                  echecs.append(f"{chemin.stem}: bonnes pratiques {scores['bonnes_pratiques']:.2f} < 0.95")
              if chemin.stem != "connexion" and scores["seo"] < 0.95:
                  echecs.append(f"{chemin.stem}: SEO {scores['seo']:.2f} < 0.95")
              if scores["performance"] < 0.70:
                  echecs.append(f"{chemin.stem}: performance {scores['performance']:.2f} < 0.70")
              if cls is not None and cls > 0.10:
                  echecs.append(f"{chemin.stem}: CLS {cls:.3f} > 0.10")

          if echecs:
              print("\nÉCHECS:")
              for echec in echecs:
                  print(f"- {echec}")
              raise SystemExit(1)
          PY
