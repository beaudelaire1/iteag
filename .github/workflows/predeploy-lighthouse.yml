name: Predeploy Lighthouse

# Les mesures Lighthouse doivent porter sur le commit réellement servi par la
# préproduction. Ce workflow tourne donc après un push sur main, attend le
# redéploiement Coolify et refuse toute révision différente de github.sha avant
# de mesurer quoi que ce soit.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predeploy-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lighthouse mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://iteag-preprod.137.74.169.188.sslip.io
    steps:
      - uses: actions/checkout@v6

      - name: Prouver la révision déployée et l'hôte SEO
        shell: bash
        run: |
          set -euo pipefail
          python src/scripts/verifier_preprod_deployee.py \
            --base-url "$BASE_URL" \
            --revision "$GITHUB_SHA" \
            --attente 600 \
            --intervalle 15

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Vérifier le noindex de la préproduction et de la connexion
        shell: bash
        run: |
          set -euo pipefail
          python - "$BASE_URL" <<'PY'
          from html.parser import HTMLParser
          import sys
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          class RobotsParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.robots = []

              def handle_starttag(self, tag, attrs):
                  if tag != "meta":
                      return
                  data = {str(cle).lower(): valeur for cle, valeur in attrs if cle}
                  if (data.get("name") or "").lower() == "robots":
                      self.robots.append((data.get("content") or "").lower())

          base = sys.argv[1].rstrip("/") + "/"
          for path in ("", "connexion/"):
              url = urljoin(base, path)
              req = Request(url, headers={"User-Agent": "ITEAG-Predeploy-Audit/1.0"})
              with urlopen(req, timeout=20) as rep:
                  html = rep.read().decode("utf-8", errors="replace")
                  xrobots = (rep.headers.get("X-Robots-Tag") or "").lower()
              assert "noindex" in xrobots, (url, xrobots)
              if path == "connexion/":
                  parser = RobotsParser()
                  parser.feed(html)
                  assert any("noindex" in contenu for contenu in parser.robots), parser.robots
                  print(f"Connexion noindex (HTTP + meta): {xrobots} / {parser.robots}")
              else:
                  print(f"Préproduction noindex par HTTP: {xrobots}")
          PY

      - name: Auditer trois fois les pages clés
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lighthouse
          declare -A pages=(
            [accueil]="/"
            [formations]="/formations/"
            [candidature]="/admissions/candidature/"
            [connexion]="/connexion/"
            [bibliotheque]="/bibliotheque/"
            [boutique]="/boutique/"
            [elearning]="/e-learning/"
          )

          for nom in accueil formations candidature connexion bibliotheque boutique elearning; do
            url="${BASE_URL}${pages[$nom]}"
            for tentative in 1 2 3; do
              echo "=== Lighthouse: ${nom} — mesure ${tentative}/3 — ${url} ==="
              sortie="/tmp/lighthouse/${nom}-${tentative}.json"
              if ! npx --yes lighthouse@13.4.1 "$url" \
                --quiet \
                --chrome-flags="--headless --no-sandbox --disable-gpu" \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json \
                --output-path="$sortie"; then
                echo "Trace Lighthouse instable : une relance technique." >&2
                npx --yes lighthouse@13.4.1 "$url" \
                  --quiet \
                  --chrome-flags="--headless --no-sandbox --disable-gpu" \
                  --only-categories=performance,accessibility,best-practices,seo \
                  --output=json \
                  --output-path="$sortie"
              fi
            done
          done

      - name: Contrôler les métriques et tous les audits automatisés
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path
          from statistics import median

          PAGES = (
              "accueil",
              "formations",
              "candidature",
              "connexion",
              "bibliotheque",
              "boutique",
              "elearning",
          )
          SEO_IGNORES_PREPROD = {"is-crawlable"}
          LCP_BON_MS = 2500
          echecs = []

          def charger(page):
              return [
                  json.loads(Path(f"/tmp/lighthouse/{page}-{tentative}.json").read_text())
                  for tentative in (1, 2, 3)
              ]

          def score(data, categorie):
              return data["categories"][categorie]["score"]

          def valeur(data, audit):
              return data["audits"].get(audit, {}).get("numericValue")

          def echecs_categorie(data, categorie, ignores=frozenset()):
              audits = data["audits"]
              resultat = []
              for reference in data["categories"][categorie].get("auditRefs", []):
                  identifiant = reference["id"]
                  if identifiant in ignores:
                      continue
                  audit = audits.get(identifiant, {})
                  audit_score = audit.get("score")
                  mode = audit.get("scoreDisplayMode")
                  if audit_score is not None and audit_score < 1 and mode not in {"notApplicable", "informative", "manual"}:
                      resultat.append((identifiant, audit_score, audit.get("title", "")))
              return resultat

          for page in PAGES:
              mesures = charger(page)
              performances = [score(data, "performance") for data in mesures]
              accessibilites = [score(data, "accessibility") for data in mesures]
              bonnes_pratiques = [score(data, "best-practices") for data in mesures]
              seos = [score(data, "seo") for data in mesures]
              lcps = [valeur(data, "largest-contentful-paint") for data in mesures]
              tbts = [valeur(data, "total-blocking-time") for data in mesures]
              clss = [valeur(data, "cumulative-layout-shift") for data in mesures]

              perf_mediane = median(performances)
              lcp_mediane = median(v for v in lcps if v is not None)
              tbt_mediane = median(v for v in tbts if v is not None)
              cls_max = max(v for v in clss if v is not None)

              print(f"\n{page.upper()}")
              print("  performance       : " + ", ".join(f"{v*100:.0f}" for v in performances))
              print(f"  médiane performance: {perf_mediane*100:.0f}")
              print("  accessibilité     : " + ", ".join(f"{v*100:.0f}" for v in accessibilites))
              print("  bonnes pratiques  : " + ", ".join(f"{v*100:.0f}" for v in bonnes_pratiques))
              print("  SEO préprod       : " + ", ".join(f"{v*100:.0f}" for v in seos))
              print(f"  LCP médian        : {lcp_mediane:.0f} ms")
              print(f"  TBT médian        : {tbt_mediane:.0f} ms")
              print(f"  CLS max           : {cls_max:.3f}")

              if lcp_mediane > LCP_BON_MS:
                  echecs.append(f"{page}: LCP médian {lcp_mediane:.0f} ms > {LCP_BON_MS} ms")
              if cls_max > 0.10:
                  echecs.append(f"{page}: CLS max {cls_max:.3f} > 0.10")

              # Un score inférieur à 100 en accessibilité / bonnes pratiques
              # signifie qu'au moins un audit automatisé a réellement échoué :
              # on affiche l'audit exact au lieu d'accepter un score agrégé.
              for index, data in enumerate(mesures, start=1):
                  for categorie in ("accessibility", "best-practices"):
                      for identifiant, audit_score, titre in echecs_categorie(data, categorie):
                          echecs.append(
                              f"{page} mesure {index}: {categorie} {identifiant}={audit_score} — {titre}"
                          )
                  for identifiant, audit_score, titre in echecs_categorie(data, "seo", SEO_IGNORES_PREPROD):
                      echecs.append(f"{page} mesure {index}: SEO {identifiant}={audit_score} — {titre}")

              # Les JSON complets sont conservés en artefact. On affiche aussi
              # les diagnostics LCP disponibles pour rendre un échec actionnable.
              if lcp_mediane > LCP_BON_MS:
                  mediane = sorted(
                      (valeur(data, "largest-contentful-paint"), data) for data in mesures
                  )[1][1]
                  for identifiant in (
                      "largest-contentful-paint-element",
                      "lcp-breakdown-insight",
                      "lcp-discovery-insight",
                  ):
                      audit = mediane["audits"].get(identifiant)
                      if audit:
                          print(f"  diagnostic {identifiant}: {json.dumps(audit.get('details', {}), ensure_ascii=False)[:6000]}")

          if echecs:
              print("\nÉCHECS:")
              for echec in sorted(set(echecs)):
                  print(f"- {echec}")
              raise SystemExit(1)
          PY

      - name: Conserver les rapports Lighthouse bruts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-preprod-${{ github.sha }}
          path: /tmp/lighthouse/*.json
          if-no-files-found: error
          retention-days: 14
