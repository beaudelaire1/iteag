name: Corriger traitement inscriptions temporairement

on:
  push:
    branches: [agent/qcm-intuitif-motif-refus]
    paths:
      - .github/workflows/corriger-traitement-inscriptions-temporaire.yml

permissions:
  contents: write

jobs:
  corriger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corriger le workflow métier et l’interface
        run: |
          python - <<'PY'
          from pathlib import Path

          def remplacer(path, ancien, nouveau):
              fichier = Path(path)
              texte = fichier.read_text(encoding="utf-8")
              if ancien not in texte:
                  raise SystemExit(f"Bloc attendu absent dans {path}")
              fichier.write_text(texte.replace(ancien, nouveau, 1), encoding="utf-8")

          remplacer(
              "src/apps/academics/services/inscriptions.py",
              '''    if action not in transitions:
              raise ValidationError("Action inconnue.")
          sources, cible = transitions[action]
          if demande.statut not in sources:
              raise ValidationError("Cette transition n'est pas autorisée depuis le statut actuel.")
          ''',
              '''    if action not in transitions:
              raise ValidationError("Action inconnue.")
          sources, cible = transitions[action]

          # Un double clic, un retour arrière ou une reprise réseau peut rejouer
          # exactement la décision qui vient d'aboutir. L'opération est alors
          # idempotente : elle ne crée ni second historique, ni message d'erreur.
          if demande.statut == cible:
              return demande

          if demande.statut not in sources:
              raise ValidationError(
                  "Cette demande a déjà changé d'état. Rechargez la page avant d'appliquer une nouvelle décision."
              )
          ''',
          )

          remplacer(
              "src/apps/academics/services/inscriptions.py",
              '''    cours_session = type(demande.cours_session).objects.select_for_update().get(pk=demande.cours_session_id)
              motif = cours_session.motif_indisponibilite(demande.etudiant)
              deja_inscrit = InscriptionSession.objects.filter(
                  etudiant=demande.etudiant,
                  cours_session=cours_session,
              ).first()
              if motif and not deja_inscrit:
                  raise ValidationError(motif)
          ''',
              '''    cours_session = type(demande.cours_session).objects.select_for_update().get(pk=demande.cours_session_id)
              deja_inscrit = InscriptionSession.objects.filter(
                  etudiant=demande.etudiant,
                  cours_session=cours_session,
              ).first()

              # La recevabilité publique a été vérifiée au dépôt de la demande.
              # Au moment où le secrétariat statue, on ne rejoue pas la fermeture
              # des inscriptions, la date limite, le statut « programmé » ou le
              # parcours : ces valeurs peuvent avoir changé pendant l'instruction.
              # Seules les incohérences qui rendent l'inscription impossible au
              # moment de l'écriture restent bloquantes.
              if deja_inscrit:
                  raise ValidationError("Cet étudiant est déjà inscrit à ce cours.")
              if cours_session.places_restantes <= 0:
                  raise ValidationError("Ce cours est complet : aucune place ne peut être attribuée.")
          ''',
          )

          remplacer(
              "src/apps/administration/forms.py",
              '''class EnrollmentDecisionForm(FormulaireITEAG):
              ACTIONS = [
                  ("demander_paiement", "Valider administrativement et demander le paiement"),
                  ("confirmer", "Confirmer l'inscription"),
                  ("refuser", "Refuser la demande"),
                  ("reouvrir", "Rouvrir la demande"),
              ]
          ''',
              '''class EnrollmentDecisionForm(FormulaireITEAG):
              ACTIONS = [
                  ("demander_paiement", "Valider administrativement et demander le paiement"),
                  ("confirmer", "Confirmer l'inscription"),
                  ("refuser", "Refuser la demande"),
                  ("reouvrir", "Rouvrir la demande"),
              ]
              ACTIONS_PAR_STATUT = {
                  DemandeInscriptionCours.Statut.SOUMISE: {"demander_paiement", "confirmer", "refuser"},
                  DemandeInscriptionCours.Statut.PAIEMENT_ATTENTE: {"confirmer", "refuser"},
                  DemandeInscriptionCours.Statut.CONFIRMEE: set(),
                  DemandeInscriptionCours.Statut.REFUSEE: {"reouvrir"},
                  DemandeInscriptionCours.Statut.ANNULEE: {"reouvrir"},
              }
          ''',
          )

          remplacer(
              "src/apps/administration/forms.py",
              '''        self.demande = demande
              self.fields["paiement"].queryset = Paiement.objects.filter(
          ''',
              '''        self.demande = demande
              actions_autorisees = self.ACTIONS_PAR_STATUT.get(demande.statut, set())
              self.fields["action"].choices = [
                  (valeur, libelle) for valeur, libelle in self.ACTIONS if valeur in actions_autorisees
              ]
              self.fields["paiement"].queryset = Paiement.objects.filter(
          ''',
          )

          remplacer(
              "src/templates/administration/enrollment_request_detail.html",
              '''                <div><dt class="text-xs text-warm-500">Session</dt><dd class="mt-1 font-semibold text-navy-900">{{ demande.cours_session.session }}</dd></div>
              ''',
              '''                <div><dt class="text-xs text-warm-500">Session</dt><dd class="mt-1 font-semibold text-navy-900">{{ demande.cours_session.session }}</dd><p class="mt-1 text-xs text-warm-500">Du {{ demande.cours_session.session.date_debut|date:"d/m/Y" }} au {{ demande.cours_session.session.date_fin|date:"d/m/Y" }}</p></div>
              ''',
          )

          remplacer(
              "src/templates/administration/enrollment_request_detail.html",
              '''    <aside>
              <form method="post" action="{% url 'administration:enrollment_request_action' demande.pk %}" class="card-elevated sticky top-24 space-y-5">
                  {% csrf_token %}
                  <div><h2 class="text-lg font-semibold text-navy-900">Décision du secrétariat</h2><p class="mt-1 text-xs leading-5 text-warm-500">La confirmation crée automatiquement l’inscription au cours. Si un montant est dû, un paiement confirmé ou une exonération motivée est obligatoire.</p></div>
                  {% for field in decision_form %}
                  <div><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<p class="mt-1 text-xs text-warm-500">{{ field.help_text }}</p>{% endif %}</div>
                  {% endfor %}
                  <button type="submit" class="btn-primary w-full">Appliquer la décision</button>
              </form>
          </aside>
          ''',
              '''    <aside>
              {% if decision_form.action.field.choices %}
              <form method="post" action="{% url 'administration:enrollment_request_action' demande.pk %}" class="card-elevated sticky top-24 space-y-5">
                  {% csrf_token %}
                  <div><h2 class="text-lg font-semibold text-navy-900">Décision du secrétariat</h2><p class="mt-1 text-xs leading-5 text-warm-500">La confirmation crée automatiquement l’inscription au cours. Si un montant est dû, un paiement confirmé ou une exonération motivée est obligatoire.</p></div>
                  {% for field in decision_form %}
                  <div><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<p class="mt-1 text-xs text-warm-500">{{ field.help_text }}</p>{% endif %}</div>
                  {% endfor %}
                  <button type="submit" class="btn-primary w-full">Appliquer la décision</button>
              </form>
              {% else %}
              <div class="card-elevated sticky top-24" style="border-left: 3px solid var(--color-gold-500);">
                  <p class="overline mb-2">Demande clôturée</p>
                  <h2 class="text-lg font-semibold text-navy-900">{{ demande.get_statut_display }}</h2>
                  <p class="mt-2 text-sm text-warm-600">Aucune décision supplémentaire n’est disponible pour cet état. L’historique ci-contre conserve la décision appliquée.</p>
              </div>
              {% endif %}
          </aside>
          ''',
          )
          PY
      - name: Ajouter les tests de non-régression
        run: |
          cat > src/apps/academics/test_traitement_demandes.py <<'PY'
          from datetime import timedelta
          from decimal import Decimal

          import pytest
          from django.utils import timezone

          from apps.academics.models import (
              CoursDeSession,
              DemandeInscriptionCours,
              ProfilEtudiant,
              Promotion,
              SessionAcademique,
          )
          from apps.academics.services.inscriptions import traiter_demande
          from apps.accounts.models import User
          from apps.administration.forms import EnrollmentDecisionForm
          from apps.formations.models import Cours, Discipline, Parcours, Professeur

          pytestmark = pytest.mark.django_db


          @pytest.fixture
          def demande_a_traiter():
              parcours = Parcours.objects.create(
                  nom="Parcours traitement",
                  slug="parcours-traitement-demandes",
                  type_parcours=Parcours.TypeParcours.LIBRE,
              )
              promotion = Promotion.objects.create(
                  nom="Promotion traitement",
                  parcours=parcours,
                  annee_debut=2026,
                  annee_fin=2028,
              )
              compte = User.objects.create_user(
                  username="etudiant-traitement",
                  role=User.Role.ETUDIANT,
              )
              etudiant = ProfilEtudiant.objects.create(
                  utilisateur=compte,
                  parcours=parcours,
                  promotion=promotion,
                  numero_etudiant="TRT-001",
                  statut_inscription=ProfilEtudiant.StatutInscription.ACTIF,
              )
              discipline = Discipline.objects.create(nom="Traitement", slug="traitement-demandes")
              cours = Cours.objects.create(titre="Cours à traiter", slug="cours-a-traiter", discipline=discipline)
              cours.parcours.add(parcours)
              professeur = Professeur.objects.create(
                  nom="Durand",
                  prenom="Jeanne",
                  slug="jeanne-durand-traitement",
              )
              session = SessionAcademique.objects.create(
                  nom="Session future",
                  periode=SessionAcademique.Periode.TOUSSAINT,
                  annee_academique="2026-2027",
                  date_debut=timezone.localdate() + timedelta(days=30),
                  date_fin=timezone.localdate() + timedelta(days=37),
              )
              offre = CoursDeSession.objects.create(
                  session=session,
                  cours=cours,
                  enseignant=professeur,
                  statut=CoursDeSession.StatutCours.EN_COURS,
                  inscriptions_ouvertes=False,
                  date_limite_inscription=timezone.localdate() - timedelta(days=1),
                  frais_inscription=Decimal("0.00"),
              )
              demande = DemandeInscriptionCours.objects.create(
                  etudiant=etudiant,
                  cours_session=offre,
                  montant_du=Decimal("0.00"),
              )
              secretaire = User.objects.create_user(
                  username="secretariat-traitement",
                  role=User.Role.SECRETARIAT,
              )
              return demande, secretaire


          def test_le_staff_peut_traiter_une_demande_deja_deposee_malgre_la_fermeture_publique(demande_a_traiter):
              demande, secretaire = demande_a_traiter

              traiter_demande(demande=demande, action="confirmer", par=secretaire)

              demande.refresh_from_db()
              assert demande.statut == DemandeInscriptionCours.Statut.CONFIRMEE
              assert demande.inscription.cours_session.session.date_fin > timezone.localdate()


          def test_une_double_confirmation_est_idempotente(demande_a_traiter):
              demande, secretaire = demande_a_traiter
              traiter_demande(demande=demande, action="confirmer", par=secretaire)
              nombre_historique = demande.historique.count()

              traiter_demande(demande=demande, action="confirmer", par=secretaire)

              assert demande.historique.count() == nombre_historique


          @pytest.mark.parametrize(
              ("statut", "actions"),
              [
                  (DemandeInscriptionCours.Statut.SOUMISE, {"demander_paiement", "confirmer", "refuser"}),
                  (DemandeInscriptionCours.Statut.PAIEMENT_ATTENTE, {"confirmer", "refuser"}),
                  (DemandeInscriptionCours.Statut.CONFIRMEE, set()),
                  (DemandeInscriptionCours.Statut.REFUSEE, {"reouvrir"}),
                  (DemandeInscriptionCours.Statut.ANNULEE, {"reouvrir"}),
              ],
          )
          def test_le_formulaire_ne_propose_que_les_transitions_valides(demande_a_traiter, statut, actions):
              demande, _ = demande_a_traiter
              demande.statut = statut
              demande.save(update_fields=["statut", "updated_at"])

              formulaire = EnrollmentDecisionForm(demande=demande)

              assert {valeur for valeur, _ in formulaire.fields["action"].choices} == actions
          PY
      - name: Formater et publier
        run: |
          pip install "ruff==0.16.1"
          cd src
          ruff format apps/academics/services/inscriptions.py apps/administration/forms.py apps/academics/test_traitement_demandes.py
          ruff check apps/academics/services/inscriptions.py apps/administration/forms.py apps/academics/test_traitement_demandes.py
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(inscriptions): fiabiliser le traitement administratif"
          git push origin HEAD:agent/qcm-intuitif-motif-refus
