name: Corriger CI temporairement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/corriger-ci-temporaire.yml

permissions:
  contents: write

jobs:
  corriger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corriger les modèles et les garde-fous
        run: |
          python - <<'PY'
          from pathlib import Path

          Path("src/apps/academics/apps.py").write_text(
              'from django.apps import AppConfig\n\n\n'
              'class AcademicsConfig(AppConfig):\n'
              '    default_auto_field = "django.db.models.BigAutoField"\n'
              '    name = "apps.academics"\n'
              '    verbose_name = "Vie académique"\n',
              encoding="utf-8",
          )

          models = Path("src/apps/academics/models.py")
          texte = models.read_text(encoding="utf-8")
          if "from apps.academics.models_assiduite import" not in texte:
              texte = texte.rstrip() + (
                  '\n\n# Django ne découvre automatiquement que `models.py`. L’import est placé après\n'
                  '# les modèles académiques historiques afin que les relations inverses\n'
                  '# d’assiduité existent avant la construction des requêtes ORM.\n'
                  'from apps.academics.models_assiduite import HistoriquePresence, Presence, SeanceCours  # noqa: E402, F401\n'
              )
              models.write_text(texte, encoding="utf-8")

          qcm = Path("src/apps/lms/test_qcm_groupes.py")
          texte = qcm.read_text(encoding="utf-8")
          cible = '''        modalite=Devoir.Modalite.QCM,
                  statut=Devoir.Statut.PUBLIE,
                  date_ouverture=timezone.now() - timedelta(days=5),'''
          remplacement = '''        modalite=Devoir.Modalite.QCM,
                  date_ouverture=timezone.now() - timedelta(days=5),'''
          if cible not in texte:
              raise SystemExit("Statut QCM publié introuvable")
          texte = texte.replace(cible, remplacement, 1)
          marqueur = '    Choix.objects.create(question=question, libelle="A", correct=True)\n'
          ajout = marqueur + '    devoir.statut = Devoir.Statut.PUBLIE\n    devoir.save(update_fields=["statut", "updated_at"])\n'
          if marqueur not in texte:
              raise SystemExit("Choix QCM introuvable")
          texte = texte.replace(marqueur, ajout, 1)
          qcm.write_text(texte, encoding="utf-8")

          fumee = Path("src/apps/core/test_fumee_detail.py")
          texte = fumee.read_text(encoding="utf-8")
          texte = texte.replace("from datetime import timedelta", "from datetime import time, timedelta", 1)
          if "from apps.academics.models_assiduite import SeanceCours" not in texte:
              texte = texte.replace(
                  "from apps.accounts.models import User\n",
                  "from apps.academics.models_assiduite import SeanceCours\nfrom apps.accounts.models import User\n",
                  1,
              )
          texte = texte.replace(
              "from apps.library.models import Emprunt, NoticeBibliographique",
              "from apps.library.models import Emprunt, NoticeBibliographique, SuspensionBibliotheque",
              1,
          )

          marqueur = '    monde["demande"] = DemandeInscriptionCours.objects.create(\n'
          ajout = '''    monde["seance_assiduite"] = SeanceCours.objects.create(
              cours_session=monde["cours_session"],
              date="2027-07-05",
              heure_debut=time(9, 0),
              heure_fin=time(12, 0),
              cree_par=monde[ADMIN],
          )
          '''
          if "monde[\"seance_assiduite\"]" not in texte:
              if marqueur not in texte:
                  raise SystemExit("Marqueur demande d'inscription absent")
              texte = texte.replace(marqueur, ajout + marqueur, 1)

          marqueur = '    monde["produit"] = ProduitLivre.objects.create(\n'
          ajout = '''    monde["suspension"] = SuspensionBibliotheque.objects.create(
              emprunteur=monde[ETUDIANT],
              emprunt=monde["emprunt"],
              jours_retard=3,
              jours_suspension=3,
              date_debut=timezone.localdate(),
              date_fin=timezone.localdate() + timedelta(days=2),
          )
          '''
          if "monde[\"suspension\"]" not in texte:
              if marqueur not in texte:
                  raise SystemExit("Marqueur produit absent")
              texte = texte.replace(marqueur, ajout + marqueur, 1)

          ajouts_routes = {
              '    "administration:emargement_pdf": (SECRETARIAT, lambda m: {"pk": m["cours_session"].pk}),\n': (
                  '    "administration:assiduite_cours": (ENSEIGNANT, lambda m: {"pk": m["cours_session"].pk}),\n'
                  '    "administration:assiduite_feuille": (ENSEIGNANT, lambda m: {"pk": m["seance_assiduite"].pk}),\n'
              ),
              '    "library:emprunt_supprimer": (SECRETARIAT, lambda m: {"pk": m["emprunt"].pk}),\n': (
                  '    "library:suspension_lever": (SECRETARIAT, lambda m: {"pk": m["suspension"].pk}),\n'
              ),
              '    "paiements:payer_commande": (PUBLIC, lambda m: {"jeton": m["commande"].jeton_suivi}),\n': (
                  '    "paiements:payer_inscription": (ETUDIANT, lambda m: {"pk": m["demande"].pk}),\n'
              ),
          }
          for route, ajout_route in ajouts_routes.items():
              nom = ajout_route.split('"', 2)[1]
              if f'"{nom}"' in texte:
                  continue
              if route not in texte:
                  raise SystemExit(f"Route d’ancrage absente : {route.strip()}")
              texte = texte.replace(route, route + ajout_route, 1)
          fumee.write_text(texte, encoding="utf-8")
          PY
      - name: Régénérer le verrou et formater
        run: |
          pip install "uv>=0.12,<1.0" "ruff==0.16.1"
          cd src
          python -m uv pip compile requirements/dev.txt \
            --python-version 3.12 \
            --python-platform linux \
            --generate-hashes \
            --no-header \
            -o /tmp/dev.resolved
          cat > requirements/dev.lock <<'EOF'
          # ═══════════════════════════════════════════════════════════════
          # VERROU DE DÉPENDANCES — NE PAS MODIFIER À LA MAIN
          # ═══════════════════════════════════════════════════════════════
          # Généré depuis « requirements/dev.txt » pour Python 3.12 sous Linux.
          # Régénération :
          #   cd src
          #   python -m uv pip compile requirements/dev.txt \
          #     --python-version 3.12 --python-platform linux \
          #     --generate-hashes --no-header -o requirements/dev.lock
          # ═══════════════════════════════════════════════════════════════
          
          EOF
          cat /tmp/dev.resolved >> requirements/dev.lock
          ruff format apps/academics/apps.py apps/academics/models.py apps/lms/test_qcm_groupes.py apps/core/test_fumee_detail.py
      - name: Publier les corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(ci): corriger les modèles tardifs et les garde-fous"
          git push origin HEAD:main
