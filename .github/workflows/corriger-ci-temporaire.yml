name: Corriger CI temporairement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/corriger-ci-temporaire.yml

permissions:
  contents: write

jobs:
  corriger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corriger les modèles et les garde-fous
        run: |
          python - <<'PY'
          from pathlib import Path

          def remplacer(path, ancien, nouveau):
              fichier = Path(path)
              texte = fichier.read_text(encoding="utf-8")
              if ancien not in texte:
                  raise SystemExit(f"Bloc attendu absent dans {path}")
              fichier.write_text(texte.replace(ancien, nouveau, 1), encoding="utf-8")

          remplacer(
              "src/apps/academics/apps.py",
              '''class AcademicsConfig(AppConfig):
              default_auto_field = "django.db.models.BigAutoField"
              name = "apps.academics"
              verbose_name = "Vie académique"

              def ready(self):
                  # Les modèles d'assiduité sont isolés pour ne pas alourdir le modèle
                  # académique historique, mais doivent être enregistrés au démarrage.
                  from . import models_assiduite  # noqa: F401
          ''',
              '''class AcademicsConfig(AppConfig):
              default_auto_field = "django.db.models.BigAutoField"
              name = "apps.academics"
              verbose_name = "Vie académique"
          ''',
          )

          models = Path("src/apps/academics/models.py")
          texte = models.read_text(encoding="utf-8")
          import_assiduite = (
              '\n\n# Django ne découvre automatiquement que `models.py`. L’import est placé après\n'
              '# les modèles académiques historiques afin que les relations inverses\n'
              '# d’assiduité existent avant la construction des requêtes ORM.\n'
              'from apps.academics.models_assiduite import HistoriquePresence, Presence, SeanceCours  # noqa: E402, F401\n'
          )
          if "from apps.academics.models_assiduite import" not in texte:
              models.write_text(texte.rstrip() + import_assiduite, encoding="utf-8")

          remplacer(
              "src/apps/lms/test_qcm_groupes.py",
              '''    devoir = Devoir.objects.create(
                  cours_session=cours,
                  titre="Fermé",
                  modalite=Devoir.Modalite.QCM,
                  statut=Devoir.Statut.PUBLIE,
                  date_ouverture=timezone.now() - timedelta(days=5),
                  date_fermeture=timezone.now() - timedelta(days=1),
              )
              question = Question.objects.create(devoir=devoir, enonce="Q", points=1)
              Choix.objects.create(question=question, libelle="A", correct=True)
              copie = Evaluation.objects.create(cours_session=cours, etudiant=etudiant, devoir=devoir)
          ''',
              '''    devoir = Devoir.objects.create(
                  cours_session=cours,
                  titre="Fermé",
                  modalite=Devoir.Modalite.QCM,
                  date_ouverture=timezone.now() - timedelta(days=5),
                  date_fermeture=timezone.now() - timedelta(days=1),
              )
              question = Question.objects.create(devoir=devoir, enonce="Q", points=1)
              Choix.objects.create(question=question, libelle="A", correct=True)
              devoir.statut = Devoir.Statut.PUBLIE
              devoir.save(update_fields=["statut", "updated_at"])
              copie = Evaluation.objects.create(cours_session=cours, etudiant=etudiant, devoir=devoir)
          ''',
          )

          fumee = Path("src/apps/core/test_fumee_detail.py")
          texte = fumee.read_text(encoding="utf-8")
          texte = texte.replace("from datetime import timedelta", "from datetime import time, timedelta", 1)
          texte = texte.replace(
              "from apps.accounts.models import User\n",
              "from apps.academics.models_assiduite import SeanceCours\nfrom apps.accounts.models import User\n",
              1,
          )
          texte = texte.replace(
              "from apps.library.models import Emprunt, NoticeBibliographique",
              "from apps.library.models import Emprunt, NoticeBibliographique, SuspensionBibliotheque",
              1,
          )
          ancien = '''    monde["cours_session"] = CoursDeSession.objects.create(
              session=monde["session"], cours=monde["cours"], enseignant=monde["professeur"]
          )
          monde["demande"] = DemandeInscriptionCours.objects.create(
          '''
          nouveau = '''    monde["cours_session"] = CoursDeSession.objects.create(
              session=monde["session"], cours=monde["cours"], enseignant=monde["professeur"]
          )
          monde["seance_assiduite"] = SeanceCours.objects.create(
              cours_session=monde["cours_session"],
              date="2027-07-05",
              heure_debut=time(9, 0),
              heure_fin=time(12, 0),
              cree_par=monde[ADMIN],
          )
          monde["demande"] = DemandeInscriptionCours.objects.create(
          '''
          if ancien not in texte:
              raise SystemExit("Insertion de la séance impossible")
          texte = texte.replace(ancien, nouveau, 1)

          ancien = '''    monde["emprunt"] = Emprunt.objects.create(
              notice=monde["notice"],
              emprunteur=monde[ETUDIANT],
              date_retour_prevue=timezone.localdate() + timedelta(days=21),
          )
          monde["produit"] = ProduitLivre.objects.create(
          '''
          nouveau = '''    monde["emprunt"] = Emprunt.objects.create(
              notice=monde["notice"],
              emprunteur=monde[ETUDIANT],
              date_retour_prevue=timezone.localdate() + timedelta(days=21),
          )
          monde["suspension"] = SuspensionBibliotheque.objects.create(
              emprunteur=monde[ETUDIANT],
              emprunt=monde["emprunt"],
              jours_retard=3,
              jours_suspension=3,
              date_debut=timezone.localdate(),
              date_fin=timezone.localdate() + timedelta(days=2),
          )
          monde["produit"] = ProduitLivre.objects.create(
          '''
          if ancien not in texte:
              raise SystemExit("Insertion de la suspension impossible")
          texte = texte.replace(ancien, nouveau, 1)

          texte = texte.replace(
              '''    "administration:emargement_pdf": (SECRETARIAT, lambda m: {"pk": m["cours_session"].pk}),
          ''',
              '''    "administration:emargement_pdf": (SECRETARIAT, lambda m: {"pk": m["cours_session"].pk}),
              "administration:assiduite_cours": (ENSEIGNANT, lambda m: {"pk": m["cours_session"].pk}),
              "administration:assiduite_feuille": (ENSEIGNANT, lambda m: {"pk": m["seance_assiduite"].pk}),
          ''',
              1,
          )
          texte = texte.replace(
              '''    "library:emprunt_supprimer": (SECRETARIAT, lambda m: {"pk": m["emprunt"].pk}),
          ''',
              '''    "library:emprunt_supprimer": (SECRETARIAT, lambda m: {"pk": m["emprunt"].pk}),
              "library:suspension_lever": (SECRETARIAT, lambda m: {"pk": m["suspension"].pk}),
          ''',
              1,
          )
          texte = texte.replace(
              '''    "paiements:payer_commande": (PUBLIC, lambda m: {"jeton": m["commande"].jeton_suivi}),
          ''',
              '''    "paiements:payer_commande": (PUBLIC, lambda m: {"jeton": m["commande"].jeton_suivi}),
              "paiements:payer_inscription": (ETUDIANT, lambda m: {"pk": m["demande"].pk}),
          ''',
              1,
          )
          fumee.write_text(texte, encoding="utf-8")
          PY
      - name: Régénérer le verrou et formater
        run: |
          pip install "uv>=0.12,<1.0" "ruff==0.16.1"
          cd src
          python -m uv pip compile requirements/dev.txt \
            --python-version 3.12 \
            --python-platform linux \
            --generate-hashes \
            --no-header \
            -o /tmp/dev.resolved
          cat > requirements/dev.lock <<'EOF'
          # ═══════════════════════════════════════════════════════════════
          # VERROU DE DÉPENDANCES — NE PAS MODIFIER À LA MAIN
          # ═══════════════════════════════════════════════════════════════
          # Généré depuis « requirements/dev.txt » pour Python 3.12 sous Linux.
          # Régénération :
          #   cd src
          #   python -m uv pip compile requirements/dev.txt \
          #     --python-version 3.12 --python-platform linux \
          #     --generate-hashes --no-header -o requirements/dev.lock
          # ═══════════════════════════════════════════════════════════════
          
          EOF
          cat /tmp/dev.resolved >> requirements/dev.lock
          ruff format apps/academics/apps.py apps/academics/models.py apps/lms/test_qcm_groupes.py apps/core/test_fumee_detail.py
      - name: Publier les corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(ci): corriger les modèles tardifs et les garde-fous"
          git push origin HEAD:main
