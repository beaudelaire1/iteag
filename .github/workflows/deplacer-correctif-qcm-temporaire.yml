name: Déplacer correctif QCM temporairement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deplacer-correctif-qcm-temporaire.yml

permissions:
  contents: write

jobs:
  corriger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Déplacer les lignes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/apps/lms/test_qcm_groupes.py")
          texte = path.read_text(encoding="utf-8")
          parasite = '''    Choix.objects.create(question=question, libelle="A", correct=True)
              devoir.statut = Devoir.Statut.PUBLIE
              devoir.save(update_fields=["statut", "updated_at"])
              Choix.objects.create(question=question, libelle="B", correct=True)
          '''
          sain = '''    Choix.objects.create(question=question, libelle="A", correct=True)
              Choix.objects.create(question=question, libelle="B", correct=True)
          '''
          if parasite not in texte:
              raise SystemExit("Bloc parasite introuvable")
          texte = texte.replace(parasite, sain, 1)

          cible = '''    question = Question.objects.create(devoir=devoir, enonce="Q", points=1)
              Choix.objects.create(question=question, libelle="A", correct=True)
              copie = Evaluation.objects.create(cours_session=cours, etudiant=etudiant, devoir=devoir)
          '''
          remplacement = '''    question = Question.objects.create(devoir=devoir, enonce="Q", points=1)
              Choix.objects.create(question=question, libelle="A", correct=True)
              devoir.statut = Devoir.Statut.PUBLIE
              devoir.save(update_fields=["statut", "updated_at"])
              copie = Evaluation.objects.create(cours_session=cours, etudiant=etudiant, devoir=devoir)
          '''
          if cible not in texte:
              raise SystemExit("Bloc cible introuvable")
          path.write_text(texte.replace(cible, remplacement, 1), encoding="utf-8")
          PY
          pip install "ruff==0.16.1"
          cd src
          ruff format apps/lms/test_qcm_groupes.py
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/lms/test_qcm_groupes.py
          git commit -m "test(lms): publier le QCM après avoir créé ses choix"
          git push origin HEAD:main
