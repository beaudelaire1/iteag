name: Régénérer dev.lock temporairement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/regenerer-dev-lock-temporaire.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le résolveur
        run: pip install "uv>=0.12,<1.0"
      - name: Régénérer dev.lock pour Linux et Python 3.12
        working-directory: src
        run: |
          python -m uv pip compile requirements/dev.txt \
            --python-version 3.12 \
            --python-platform linux \
            --generate-hashes \
            --no-header \
            -o /tmp/dev.resolved
          cat > requirements/dev.lock <<'EOF'
          # ═══════════════════════════════════════════════════════════════
          # VERROU DE DÉPENDANCES — NE PAS MODIFIER À LA MAIN
          # ═══════════════════════════════════════════════════════════════
          # Généré depuis « requirements/dev.txt » pour Python 3.12 sous Linux.
          # Régénération :
          #   cd src
          #   python -m uv pip compile requirements/dev.txt \
          #     --python-version 3.12 --python-platform linux \
          #     --generate-hashes --no-header -o requirements/dev.lock
          # ═══════════════════════════════════════════════════════════════
          
          EOF
          cat /tmp/dev.resolved >> requirements/dev.lock
      - name: Publier le verrou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/requirements/dev.lock
          if git diff --cached --quiet; then
            echo "Le verrou est déjà à jour."
            exit 0
          fi
          git commit -m "chore(deps): régénérer dev.lock avec WhiteNoise"
          git push origin HEAD:main
