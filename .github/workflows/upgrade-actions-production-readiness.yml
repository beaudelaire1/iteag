name: Upgrade actions production readiness

on:
  push:
    branches: [agent/production-readiness]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/production-readiness
      - name: Remplacer les actions Node 20 restantes
        run: |
          sed -i 's#actions/checkout@v4#actions/checkout@v6#g' .github/workflows/*.yml
          sed -i 's#actions/setup-python@v5#actions/setup-python@v6#g' .github/workflows/*.yml
          sed -i 's#actions/setup-node@v4#actions/setup-node@v6#g' .github/workflows/*.yml
      - name: Committer les mises à jour
        run: |
          if git diff --quiet; then
            echo "Toutes les actions sont déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Mettre à jour les actions GitHub vers Node 24"
          git push origin HEAD:agent/production-readiness
