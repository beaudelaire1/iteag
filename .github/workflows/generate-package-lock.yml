name: Generate package lock

on:
  push:
    branches: [agent/production-readiness]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Générer et versionner package-lock.json
        working-directory: src
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json existe déjà."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f package-lock.json
          git commit -m "build: verrouiller les dépendances frontend"
          git push origin HEAD:agent/production-readiness
