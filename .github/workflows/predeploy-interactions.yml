name: Predeploy browser interactions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predeploy-interactions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Navigation clavier et mobile
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/go-live-ops-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://iteag-preprod.137.74.169.188.sslip.io
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Installer le pilote navigateur léger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-node"
          npm install --prefix "$RUNNER_TEMP/browser-node" --no-audit --no-fund puppeteer-core@24.16.0

      - name: Éprouver les interactions publiques
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/browser-node/node_modules
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/interactions.cjs" <<'JS'
          const puppeteer = require("puppeteer-core");

          const base = process.env.BASE_URL.replace(/\/$/, "");
          const erreurs = [];

          function verifier(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function ouvrir(browser, chemin, viewport) {
            const page = await browser.newPage();
            await page.setViewport(viewport);
            await page.setCookie({
              name: "iteag_cookie_consent",
              value: "essential",
              url: `${base}/`,
              secure: true,
              sameSite: "Lax",
            });
            page.on("pageerror", (erreur) => erreurs.push(`${chemin}: ${erreur.message}`));
            page.on("requestfailed", (requete) => {
              try {
                const url = new URL(requete.url());
                if (url.origin === new URL(base).origin) {
                  erreurs.push(`${chemin}: requête interne échouée ${requete.url()} — ${requete.failure()?.errorText || "inconnue"}`);
                }
              } catch (_) {}
            });
            const reponse = await page.goto(`${base}${chemin}`, { waitUntil: "networkidle2", timeout: 30000 });
            verifier(reponse && reponse.status() === 200, `${chemin}: HTTP ${reponse?.status()}`);
            return page;
          }

          async function verifierLabels(page, nomPage) {
            const sansLabel = await page.evaluate(() => {
              return Array.from(document.querySelectorAll("input:not([type=hidden]), select, textarea"))
                .filter((champ) => !champ.disabled)
                .filter((champ) => {
                  const id = champ.id;
                  const label = id ? document.querySelector(`label[for="${CSS.escape(id)}"]`) : null;
                  return !label && !champ.getAttribute("aria-label") && !champ.getAttribute("aria-labelledby") && !champ.closest("label");
                })
                .map((champ) => ({ tag: champ.tagName, type: champ.type, name: champ.name, id: champ.id }));
            });
            verifier(sansLabel.length === 0, `${nomPage}: champs sans label ${JSON.stringify(sansLabel)}`);
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: "/usr/bin/google-chrome",
              headless: true,
              args: ["--no-sandbox", "--disable-gpu"],
            });

            // Clavier : le lien d'évitement est la première cible et fonctionne.
            let page = await ouvrir(browser, "/", { width: 1440, height: 900, deviceScaleFactor: 1 });
            await page.keyboard.press("Tab");
            const premierFocus = await page.evaluate(() => ({
              href: document.activeElement?.getAttribute("href"),
              visible: !!document.activeElement && getComputedStyle(document.activeElement).position === "fixed",
            }));
            verifier(premierFocus.href === "#main-content", `Accueil: premier focus inattendu ${JSON.stringify(premierFocus)}`);
            await page.keyboard.press("Enter");
            await new Promise((resolve) => setTimeout(resolve, 100));
            verifier((await page.evaluate(() => location.hash)) === "#main-content", "Accueil: lien d'évitement inopérant");
            await page.close();

            // Mobile : ouverture, attribut ARIA, fermeture au clavier.
            page = await ouvrir(browser, "/", { width: 390, height: 844, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
            await page.click("[data-nav-toggle]");
            let etatMenu = await page.evaluate(() => ({
              expanded: document.querySelector("[data-nav-toggle]")?.getAttribute("aria-expanded"),
              hidden: document.querySelector("[data-nav-panel]")?.hidden,
            }));
            verifier(etatMenu.expanded === "true" && etatMenu.hidden === false, `Menu mobile non ouvert ${JSON.stringify(etatMenu)}`);
            await page.keyboard.press("Escape");
            await new Promise((resolve) => setTimeout(resolve, 100));
            etatMenu = await page.evaluate(() => ({
              expanded: document.querySelector("[data-nav-toggle]")?.getAttribute("aria-expanded"),
              hidden: document.querySelector("[data-nav-panel]")?.hidden,
            }));
            verifier(etatMenu.expanded === "false" && etatMenu.hidden === true, `Menu mobile non refermé par Escape ${JSON.stringify(etatMenu)}`);
            await page.close();

            // Connexion : labels et bascule d'affichage du mot de passe.
            page = await ouvrir(browser, "/connexion/", { width: 390, height: 844, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
            await verifierLabels(page, "Connexion");
            verifier((await page.$("[data-password-toggle]")) !== null, "Connexion: bouton afficher/masquer absent");
            await page.click("[data-password-toggle]");
            const motDePasse = await page.evaluate(() => ({
              type: document.querySelector("#id_password")?.type,
              pressed: document.querySelector("[data-password-toggle]")?.getAttribute("aria-pressed"),
            }));
            verifier(motDePasse.type === "text" && motDePasse.pressed === "true", `Connexion: bascule mot de passe défaillante ${JSON.stringify(motDePasse)}`);
            await page.close();

            // Candidature : tous les champs visibles sont étiquetés. Le honeypot
            // est volontairement laissé au test Django tant que la correction de
            // cette PR n'est pas encore déployée sur la préproduction.
            page = await ouvrir(browser, "/admissions/candidature/", { width: 390, height: 844, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
            await verifierLabels(page, "Candidature");
            await page.close();

            // Une 404 doit rester une 404 de présentation, jamais une erreur 500.
            page = await browser.newPage();
            const reponse404 = await page.goto(`${base}/__audit-page-inexistante__`, { waitUntil: "networkidle2", timeout: 30000 });
            verifier(reponse404 && reponse404.status() === 404, `Page inexistante: HTTP ${reponse404?.status()}`);
            const corps404 = await page.content();
            verifier(!/Traceback|DEBUG\s*=\s*True|Exception Type/i.test(corps404), "Page 404 expose des détails techniques");
            await page.close();

            await browser.close();

            if (erreurs.length) {
              console.error("Erreurs navigateur internes:", erreurs);
              process.exit(1);
            }
            console.log("OK — clavier, menu mobile, labels, mot de passe et 404 validés.");
          })().catch((erreur) => {
            console.error(erreur);
            process.exit(1);
          });
          JS

          node "$RUNNER_TEMP/interactions.cjs"
JS