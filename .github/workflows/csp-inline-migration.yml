name: CSP inline style migration

# Workflow ponctuel du chantier agent/mise-a-niveau-go-sans-reserve.
# La migration statique a déjà remplacé les attributs style par des classes
# déterministes. On reconstruit leur feuille depuis `main` — seule source où les
# déclarations originales existent encore — puis on restaure les artefacts
# non-web et on applique les derniers remplacements dynamiques. Le workflow sera
# supprimé dès que ce passage est terminé.
on:
  push:
    branches: [agent/mise-a-niveau-go-sans-reserve]

permissions:
  contents: write

concurrency:
  group: csp-inline-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/mise-a-niveau-go-sans-reserve
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reconstruire la feuille statique depuis les gabarits source de main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          source_dir="$RUNNER_TEMP/iteag-main"
          git worktree add --detach "$source_dir" origin/main
          cp src/scripts/migrer_styles_inline.py "$source_dir/src/scripts/migrer_styles_inline.py"
          (
            cd "$source_dir/src"
            python scripts/migrer_styles_inline.py --write
            test "$(grep -c '^\.csp-style-' assets/css/inline-migre.css)" -gt 200
          )
          cp "$source_dir/src/assets/css/inline-migre.css" src/assets/css/inline-migre.css
          git worktree remove --force "$source_dir"

      - name: Restaurer les artefacts email et PDF hors CSP web
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=origin/main -- \
            ':(glob)src/templates/**/emails/**/*.html' \
            ':(glob)src/templates/**/pdf/**/*.html' \
            ':(glob)src/templates/**/*_email.html' \
            ':(glob)src/templates/**/*_pdf.html'

      - name: Migrer les styles métier dynamiques fermés
        working-directory: src
        run: python scripts/migrer_styles_dynamiques.py --write

      - name: Vérifier la fermeture CSP des pages web
        working-directory: src
        run: |
          python scripts/migrer_styles_dynamiques.py --check
          python scripts/migrer_styles_inline.py --check
          test "$(grep -c '^\.csp-style-' assets/css/inline-migre.css)" -gt 200

      - name: Enregistrer uniquement les transformations produites
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Aucune transformation supplémentaire."
            exit 0
          fi
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/templates src/assets/css/inline-migre.css
          git commit -m "Reconstruire la feuille CSP et finaliser les gabarits web"
          git push origin HEAD:agent/mise-a-niveau-go-sans-reserve
