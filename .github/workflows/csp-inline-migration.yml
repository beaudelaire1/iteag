name: CSP inline style migration

on:
  push:
    branches: [agent/mise-a-niveau-go-sans-reserve]

permissions:
  contents: write

concurrency:
  group: csp-inline-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/mise-a-niveau-go-sans-reserve
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Restaurer base.py puis appliquer seulement la CSP des styles
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git restore --source=origin/main -- src/config/settings/base.py
          python - <<'PY'
          from pathlib import Path
          path = Path("src/config/settings/base.py")
          texte = path.read_text(encoding="utf-8")
          ancien = '        "style-src": ["\'self\'", "\'unsafe-inline\'"],\n'
          nouveau = (
              '        "style-src": ["\'self\'"],\n'
              '        "style-src-elem": ["\'self\'"],\n'
              '        "style-src-attr": ["\'none\'"],\n'
          )
          assert texte.count(ancien) == 1, "La directive style-src attendue n'est pas unique."
          path.write_text(texte.replace(ancien, nouveau), encoding="utf-8")
          PY

      - name: Restaurer les artefacts email et PDF hors CSP web
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=origin/main -- \
            ':(glob)src/templates/**/emails/**/*.html' \
            ':(glob)src/templates/**/pdf/**/*.html' \
            ':(glob)src/templates/**/*_email.html' \
            ':(glob)src/templates/**/*_pdf.html'

      - name: Remplacer les classes hashées par des utilitaires lisibles
        working-directory: src
        run: |
          python scripts/remplacer_classes_csp.py --write
          python scripts/remplacer_classes_csp.py --check

      - name: Retirer la feuille temporaire de migration
        shell: bash
        run: |
          set -euo pipefail
          rm src/assets/css/inline-migre.css
          python - <<'PY'
          from pathlib import Path
          path = Path("src/assets/css/production.css")
          texte = path.read_text(encoding="utf-8")
          path.write_text(texte.replace('@import "./inline-migre.css";\n', ""), encoding="utf-8")
          PY

      - name: Vérifier la fermeture CSP des pages web
        working-directory: src
        run: |
          python scripts/migrer_styles_dynamiques.py --check
          python scripts/migrer_styles_inline.py --check
          python - <<'PY'
          from pathlib import Path

          templates = Path("templates")
          for path in templates.rglob("*.html"):
              relatif = path.relative_to(templates)
              parties = {p.lower() for p in relatif.parts[:-1]}
              nom = relatif.name.lower()
              if "emails" in parties or "pdf" in parties or nom.endswith("_email.html") or nom.endswith("_pdf.html"):
                  continue
              texte = path.read_text(encoding="utf-8")
              assert "csp-style-" not in texte, path
              assert ' style="' not in texte and " style='" not in texte, path

          base = Path("config/settings/base.py").read_text(encoding="utf-8")
          assert '"style-src": ["\'self\'"]' in base
          assert '"style-src-attr": ["\'none\'"]' in base
          assert '"style-src": ["\'self\'", "\'unsafe-inline\'"]' not in base
          print("OK — gabarits web lisibles et CSP de style fermée.")
          PY

      - name: Construire les assets avec les nouvelles classes
        working-directory: src
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Enregistrer la migration lisible
        shell: bash
        run: |
          set -euo pipefail
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/config/settings/base.py src/templates src/assets/css
          git commit -m "Remplacer les classes CSP opaques par des utilitaires lisibles"
          git push origin HEAD:agent/mise-a-niveau-go-sans-reserve
