name: CSP inline style migration

# Workflow ponctuel du chantier agent/mise-a-niveau-go-sans-reserve.
# Il remet d'abord les artefacts non-web (emails/PDF) à leur rendu d'origine,
# puis applique le codemod uniquement aux pages HTML réellement soumises à la
# CSP du navigateur. Il sera supprimé à la fin du chantier.
on:
  push:
    branches: [agent/mise-a-niveau-go-sans-reserve]

permissions:
  contents: write

concurrency:
  group: csp-inline-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/mise-a-niveau-go-sans-reserve
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restaurer les artefacts email et PDF hors CSP web
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git restore --source=origin/main -- \
            ':(glob)src/templates/**/emails/**/*.html' \
            ':(glob)src/templates/**/pdf/**/*.html' \
            ':(glob)src/templates/**/*_email.html' \
            ':(glob)src/templates/**/*_pdf.html'

      - name: Migrer les styles statiques des pages web
        working-directory: src
        run: python scripts/migrer_styles_inline.py --write

      - name: Enregistrer uniquement les transformations produites
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Aucune transformation supplémentaire."
            exit 0
          fi
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/templates src/assets/css/inline-migre.css
          git commit -m "Restaurer les artefacts non-web et migrer les styles CSP"
          git push origin HEAD:agent/mise-a-niveau-go-sans-reserve
