name: Maintenance patch

on:
  push:
    branches: [fix/ci-et-qcm-fiable]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-et-qcm-fiable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Appliquer les corrections ciblées
        run: python tools/maintenance_patch_ci_qcm.py
      - name: Vérifier le diff
        run: git diff --check
      - name: Publier le correctif sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git commit -m "fix: fiabiliser la CI, l'assiduité et les QCM"
          git push origin HEAD:fix/ci-et-qcm-fiable
