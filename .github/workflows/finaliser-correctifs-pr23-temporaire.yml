name: Finaliser correctifs PR23 temporairement

on:
  push:
    branches: [agent/qcm-intuitif-motif-refus]
    paths:
      - .github/workflows/finaliser-correctifs-pr23-temporaire.yml

permissions:
  contents: write

jobs:
  finaliser:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iteag_test
          POSTGRES_USER: iteag
          POSTGRES_PASSWORD: iteag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corriger les trois régressions ciblées
        run: |
          python - <<'PY'
          from pathlib import Path

          assiduite = Path("src/apps/administration/views_assiduite.py")
          texte = assiduite.read_text(encoding="utf-8")
          ancre = '''class AssiduiteListView(AssiduiteAccessMixin, ListView):
              template_name = "administration/assiduite/liste.html"
          '''
          remplacement = '''class AssiduiteListView(AssiduiteAccessMixin, ListView):
              """Vue globale réservée à la direction et au secrétariat.

              L'enseignant conserve l'accès aux feuilles de ses propres cours,
              mais ne peut pas parcourir l'assiduité de tout l'institut.
              """

              def test_func(self):
                  user = self.request.user
                  return user.is_admin or user.is_secretariat

              template_name = "administration/assiduite/liste.html"
          '''
          if ancre not in texte:
              raise SystemExit("Vue globale d'assiduité introuvable")
          assiduite.write_text(texte.replace(ancre, remplacement, 1), encoding="utf-8")

          qcm = Path("src/apps/lms/views_qcm_securisees.py")
          texte = qcm.read_text(encoding="utf-8")
          ancien = "Une question à réponse unique ne peut avoir qu'une seule bonne réponse."
          nouveau = "Une question à réponse unique ne peut avoir qu’une seule bonne réponse."
          if ancien not in texte:
              raise SystemExit("Message de validation QCM introuvable")
          qcm.write_text(texte.replace(ancien, nouveau, 1), encoding="utf-8")

          tests = Path("src/apps/lms/test_qcm_groupes.py")
          texte = tests.read_text(encoding="utf-8")
          ancien = '''    Choix.objects.create(question=question, libelle="A", correct=True)
              devoir.statut = Devoir.Statut.PUBLIE
          '''
          nouveau = '''    Choix.objects.create(question=question, libelle="A", correct=True)
              Choix.objects.create(question=question, libelle="B", correct=False)
              devoir.statut = Devoir.Statut.PUBLIE
          '''
          if ancien not in texte:
              raise SystemExit("Préparation du QCM fermé introuvable")
          tests.write_text(texte.replace(ancien, nouveau, 1), encoding="utf-8")
          PY
      - name: Installer les dépendances verrouillées
        working-directory: src
        run: pip install --require-hashes -r requirements/dev.lock
      - name: Formater et tester
        working-directory: src
        env:
          DATABASE_URL: postgres://iteag:iteag_test@localhost:5432/iteag_test
          DJANGO_SECRET_KEY: correctif-temporaire-pr23
        run: |
          ruff format apps/administration/views_assiduite.py apps/lms/views_qcm_securisees.py apps/lms/test_qcm_groupes.py
          ruff check apps/administration/views_assiduite.py apps/lms/views_qcm_securisees.py apps/lms/test_qcm_groupes.py
          pytest -q \
            apps/core/test_fumee.py::TestCloisonnementDesPortails::test_les_pages_du_personnel_sont_fermees \
            apps/lms/test_qcm_creation.py \
            apps/lms/test_qcm_groupes.py::test_le_questionnaire_refuse_le_depot_hors_fenetre \
            apps/academics/test_traitement_demandes.py
      - name: Publier les corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: fermer les dernières régressions de la PR 23"
          git push origin HEAD:agent/qcm-intuitif-motif-refus
