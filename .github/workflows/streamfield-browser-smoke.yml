name: StreamField browser smoke

on:
  pull_request:
    paths:
      - "src/apps/core/editeur_riche.py"
      - "src/apps/core/templatetags/socle_wagtail.py"
      - "src/apps/website/editorial.py"
      - "src/apps/website/formulaires_actualites.py"
      - "src/apps/website/vues_actualites.py"
      - "src/static/css/streamfield-portail.css"
      - "src/static/css/streamfield-draftail-portail.css"
      - "src/static/css/streamfield-picker-portail.css"
      - "src/static/css/typed-table-portail.css"
      - "src/static/js/streamfield-draftail-portail.js"
      - "src/templates/website/actualites/formulaire.html"
      - "src/templates/website/blocks/texte_cellule_tableau.html"
      - ".github/workflows/streamfield-browser-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/apps/core/editeur_riche.py"
      - "src/apps/core/templatetags/socle_wagtail.py"
      - "src/apps/website/editorial.py"
      - "src/apps/website/formulaires_actualites.py"
      - "src/apps/website/vues_actualites.py"
      - "src/static/css/streamfield-portail.css"
      - "src/static/css/streamfield-draftail-portail.css"
      - "src/static/css/streamfield-picker-portail.css"
      - "src/static/css/typed-table-portail.css"
      - "src/static/js/streamfield-draftail-portail.js"
      - "src/templates/website/actualites/formulaire.html"
      - "src/templates/website/blocks/texte_cellule_tableau.html"
      - ".github/workflows/streamfield-browser-smoke.yml"

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pip install --require-hashes -r requirements/dev.lock
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: python manage.py collectstatic --noinput
      - name: Vérifier les tests ciblés du StreamField
        run: pytest apps/website/test_streamfield_portail.py -q
      - name: Vérifier les migrations
        run: python manage.py makemigrations --check --dry-run --skip-checks
      - name: Construire une page avec le vrai BlockWidget
        run: |
          python - <<'PY'
          import django
          from pathlib import Path

          django.setup()

          from django.core.management import call_command
          from django.template import RequestContext, Template
          from django.test import RequestFactory
          from apps.website.formulaires_actualites import ActualiteForm

          call_command("migrate", interactive=False, verbosity=0)

          request = RequestFactory().get("/")
          request.csp_nonce = "browser-smoke"
          formulaire_vide = ActualiteForm()
          stream_block = formulaire_vide.fields["contenu"].widget.block_def
          contenu = stream_block.to_python(
              [
                  {"type": "texte", "value": "<p>Texte de contrôle</p>"},
                  {
                      "type": "tableau",
                      "value": {
                          "caption": "Tableau d'exemple",
                          "columns": [
                              {"type": "texte", "heading": "Observation"},
                              {"type": "nombre", "heading": "Valeur"},
                          ],
                          "rows": [
                              {
                                  "values": [
                                      "<p><strong>Cellule formatée</strong></p>",
                                      "12.5",
                                  ]
                              }
                          ],
                      },
                  },
              ]
          )
          form = ActualiteForm(initial={"contenu": contenu})
          template = Template("""
          <!doctype html><html><head>{% load socle_wagtail %}<meta charset="UTF-8">
          <style>body{width:auto;max-width:1200px;margin:20px auto;padding:0 20px;font-family:Arial,sans-serif}</style>
          <script>
          window.__iteagErrors = [];
          window.__pickerMetrics = null;
          window.addEventListener('error', function (event) {
            window.__iteagErrors.push(String(event.message || event.error || 'error'));
          });
          window.addEventListener('unhandledrejection', function (event) {
            window.__iteagErrors.push('promise:' + String(event.reason));
          });
          </script>
          {{ form.media.css }}{% wagtail_configuration_portail %}{{ form.media.js }}
          </head><body>{% wagtail_icones_portail %}<div class="streamfield-portail">{{ form.contenu }}</div>
          <script>
          setTimeout(function () {
            var add = document.querySelector('.c-sf-add-button');
            if (add) add.click();
          }, 1200);

          setTimeout(function () {
            var root = document.querySelector('[data-tippy-root]');
            var picker = document.querySelector('.tippy-box[data-theme="dropdown"]');
            var combo = picker ? picker.querySelector('.w-combobox-container') : null;
            var menu = picker ? picker.querySelector('.w-combobox__menu') : null;
            var options = picker ? Array.from(picker.querySelectorAll('.w-combobox__option')) : [];
            var rootRect = root ? root.getBoundingClientRect() : null;
            var comboRect = combo ? combo.getBoundingClientRect() : null;
            var menuStyle = menu ? window.getComputedStyle(menu) : null;
            var optionRects = options.map(function (option) { return option.getBoundingClientRect(); });
            window.__pickerMetrics = {
              visible: !!(comboRect && comboRect.width >= 280 && comboRect.height >= 100),
              inViewport: !!(
                rootRect && rootRect.left >= -2 && rootRect.top >= -2 &&
                rootRect.right <= window.innerWidth + 2 && rootRect.bottom <= window.innerHeight + 2
              ),
              width: comboRect ? Math.round(comboRect.width) : 0,
              scrollable: !!(menuStyle && ['auto', 'scroll'].includes(menuStyle.overflowY)),
              optionsReadable: optionRects.length >= 7 && optionRects.every(function (rect) {
                return rect.width >= 240 && rect.height >= 36;
              })
            };
            var add = document.querySelector('.c-sf-add-button[aria-expanded="true"]');
            if (add) add.click();
          }, 2100);

          setTimeout(function () {
            var addColumn = document.querySelector('.typed-table-block button.append-column');
            if (addColumn) addColumn.click();
            var cell = document.querySelector('.typed-table-block .public-DraftEditor-content');
            if (cell) {
              cell.focus();
              cell.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
              cell.dispatchEvent(new MouseEvent('mouseup', {bubbles: true}));
              cell.click();
            }
          }, 2500);

          setTimeout(function () {
            var editor = document.querySelector('.streamfield-portail > .champ .Draftail-Editor') || document.querySelector('.Draftail-Editor');
            var wrapper = editor ? editor.closest('.Draftail-Editor__wrapper') || editor : null;
            var editorRect = editor ? editor.getBoundingClientRect() : null;
            var wrapperRect = wrapper ? wrapper.getBoundingClientRect() : null;
            var editorStyle = editor ? window.getComputedStyle(editor) : null;
            var visible = !!(
              editor && editorRect && editorRect.width > 100 && editorRect.height > 40 &&
              editorStyle.display !== 'none' && editorStyle.visibility !== 'hidden' &&
              editorStyle.opacity !== '0'
            );
            var toolbar = editor ? editor.querySelector('.Draftail-Toolbar') : document.querySelector('.Draftail-Toolbar');
            var pin = document.querySelector('.Draftail-ToolbarButton--pin');
            var blockToolbar = document.querySelector('.Draftail-BlockToolbar');
            var toolbarRect = toolbar ? toolbar.getBoundingClientRect() : null;
            var toolbarStyle = toolbar ? window.getComputedStyle(toolbar) : null;
            var pinStyle = pin ? window.getComputedStyle(pin) : null;
            var blockToolbarStyle = blockToolbar ? window.getComputedStyle(blockToolbar) : null;
            var toolbarAnchored = !!(
              toolbar && toolbarRect && toolbarStyle && editorRect &&
              toolbarStyle.position === 'static' &&
              toolbarRect.width > 100 && toolbarRect.width <= editorRect.width + 2 &&
              toolbarRect.height >= 24 && toolbarRect.height <= 90 &&
              toolbarRect.top >= editorRect.top - 2 && toolbarRect.bottom <= editorRect.bottom + 2
            );
            var pinHidden = !pin || (pinStyle && pinStyle.display === 'none');
            var blockToolbarHidden = !blockToolbar || (blockToolbarStyle && blockToolbarStyle.display === 'none');
            var editorHeightSane = !!(editorRect && editorRect.height >= 120 && editorRect.height <= 360);
            var panelIcon = document.querySelector('.w-panel__toggle .w-panel__icon');
            var actionButton = document.querySelector('.w-panel__controls .button');
            var heading = document.querySelector('.w-panel__heading');
            var anchor = document.querySelector('.w-panel__anchor');
            var iconRect = panelIcon ? panelIcon.getBoundingClientRect() : null;
            var buttonRect = actionButton ? actionButton.getBoundingClientRect() : null;
            var headingStyle = heading ? window.getComputedStyle(heading) : null;
            var anchorStyle = anchor ? window.getComputedStyle(anchor) : null;
            var controlsCompact = !!(
              iconRect && iconRect.width > 0 && iconRect.width <= 24 && iconRect.height <= 24 &&
              buttonRect && buttonRect.width >= 24 && buttonRect.width <= 40 &&
              buttonRect.height >= 24 && buttonRect.height <= 40
            );
            var headingSane = !!(
              headingStyle && parseFloat(headingStyle.fontSize) >= 12 && parseFloat(headingStyle.fontSize) <= 18
            );
            var anchorsHidden = !anchor || (anchorStyle && anchorStyle.display === 'none');

            var table = document.querySelector('.typed-table-block');
            var tableWrapper = document.querySelector('.typed-table-block__wrapper');
            var tableRect = table ? table.getBoundingClientRect() : null;
            var tableWrapperRect = tableWrapper ? tableWrapper.getBoundingClientRect() : null;
            var tableWrapperStyle = tableWrapper ? window.getComputedStyle(tableWrapper) : null;
            var addColumnMenu = document.querySelector('.typed-table-block ul.add-column-menu');
            var addColumnMenuRect = addColumnMenu ? addColumnMenu.getBoundingClientRect() : null;
            var addColumnOptions = addColumnMenu ? Array.from(addColumnMenu.querySelectorAll('button')) : [];
            var addColumnOptionRects = addColumnOptions.map(function (button) { return button.getBoundingClientRect(); });
            var tableMenuStable = !!(
              addColumnMenuRect && addColumnMenuRect.width >= 160 && addColumnMenuRect.height >= 90 &&
              addColumnOptionRects.length === 3 &&
              addColumnOptionRects.every(function (rect, index) {
                return rect.width >= 150 && rect.height >= 32 &&
                  (index === 0 || rect.top > addColumnOptionRects[index - 1].top);
              })
            );
            var tableContained = !!(
              tableRect && tableWrapperRect && tableWrapperStyle &&
              tableWrapperRect.width > 300 && tableWrapperRect.width <= 1200 &&
              ['auto', 'scroll'].includes(tableWrapperStyle.overflowX)
            );
            var cellEditor = document.querySelector('.typed-table-block .Draftail-Editor');
            var cellEditorRect = cellEditor ? cellEditor.getBoundingClientRect() : null;
            var cellToolbar = cellEditor ? cellEditor.querySelector('.Draftail-Toolbar') : null;
            var cellToolbarStyle = cellToolbar ? window.getComputedStyle(cellToolbar) : null;
            var cellFormatting = !!(
              cellEditorRect && cellEditorRect.height >= 70 && cellEditorRect.height <= 190 &&
              cellToolbar && cellToolbar.querySelectorAll('.Draftail-ToolbarButton').length >= 4 &&
              cellToolbarStyle && cellToolbarStyle.display !== 'none'
            );

            var diagnostic = document.createElement('pre');
            diagnostic.id = 'iteag-browser-diagnostic';
            diagnostic.textContent = JSON.stringify({
              errors: window.__iteagErrors,
              telepath: !!window.telepath,
              wagtail: !!window.wagtail,
              stimulus: !!(window.wagtail && window.wagtail.app),
              count: !!document.querySelector('input[name="contenu-count"]'),
              draftail: !!editor,
              visible: visible,
              wrapperWidth: wrapperRect ? Math.round(wrapperRect.width) : 0,
              editorWidth: editorRect ? Math.round(editorRect.width) : 0,
              editorHeight: editorRect ? Math.round(editorRect.height) : 0,
              editorHeightSane: editorHeightSane,
              toolbarAnchored: toolbarAnchored,
              toolbarPosition: toolbarStyle ? toolbarStyle.position : '',
              toolbarWidth: toolbarRect ? Math.round(toolbarRect.width) : 0,
              toolbarHeight: toolbarRect ? Math.round(toolbarRect.height) : 0,
              pinHidden: pinHidden,
              blockToolbarHidden: blockToolbarHidden,
              controlsCompact: controlsCompact,
              iconWidth: iconRect ? Math.round(iconRect.width) : 0,
              iconHeight: iconRect ? Math.round(iconRect.height) : 0,
              buttonWidth: buttonRect ? Math.round(buttonRect.width) : 0,
              buttonHeight: buttonRect ? Math.round(buttonRect.height) : 0,
              headingSane: headingSane,
              headingFont: headingStyle ? headingStyle.fontSize : '',
              anchorsHidden: anchorsHidden,
              controller: !!document.querySelector('[data-controller="w-block"]'),
              picker: window.__pickerMetrics,
              tableContained: tableContained,
              tableMenuStable: tableMenuStable,
              tableMenuWidth: addColumnMenuRect ? Math.round(addColumnMenuRect.width) : 0,
              tableCellFormatting: cellFormatting,
              tableCellEditorHeight: cellEditorRect ? Math.round(cellEditorRect.height) : 0
            });
            document.body.appendChild(diagnostic);
          }, 3600);
          </script>
          </body></html>
          """)
          html = template.render(RequestContext(request, {"form": form}))

          racine = Path("/tmp/iteag-streamfield-browser")
          racine.mkdir(parents=True, exist_ok=True)
          (racine / "index.html").write_text(html, encoding="utf-8")
          static = racine / "static"
          if static.exists() or static.is_symlink():
              static.unlink()
          static.symlink_to(Path.cwd() / "staticfiles", target_is_directory=True)
          PY
      - name: Exécuter le composant dans Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          cd /tmp/iteag-streamfield-browser
          python -m http.server 8765 >/tmp/iteag-streamfield-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=1280,900 \
            --virtual-time-budget=9000 --dump-dom \
            http://127.0.0.1:8765/index.html > /tmp/iteag-streamfield-dom.html

          echo '--- Diagnostic navigateur ---'
          grep -o '<pre id="iteag-browser-diagnostic">[^<]*' /tmp/iteag-streamfield-dom.html || true

          grep -q '"errors":\[\]' /tmp/iteag-streamfield-dom.html
          grep -q '"count":true' /tmp/iteag-streamfield-dom.html
          grep -q '"draftail":true' /tmp/iteag-streamfield-dom.html
          grep -q '"visible":true' /tmp/iteag-streamfield-dom.html
          grep -q '"editorHeightSane":true' /tmp/iteag-streamfield-dom.html
          grep -q '"toolbarAnchored":true' /tmp/iteag-streamfield-dom.html
          grep -q '"pinHidden":true' /tmp/iteag-streamfield-dom.html
          grep -q '"blockToolbarHidden":true' /tmp/iteag-streamfield-dom.html
          grep -q '"controlsCompact":true' /tmp/iteag-streamfield-dom.html
          grep -q '"headingSane":true' /tmp/iteag-streamfield-dom.html
          grep -q '"anchorsHidden":true' /tmp/iteag-streamfield-dom.html
          grep -q '"picker":{"visible":true,"inViewport":true' /tmp/iteag-streamfield-dom.html
          grep -q '"scrollable":true,"optionsReadable":true' /tmp/iteag-streamfield-dom.html
          grep -q '"tableContained":true' /tmp/iteag-streamfield-dom.html
          grep -q '"tableMenuStable":true' /tmp/iteag-streamfield-dom.html
          grep -q '"tableCellFormatting":true' /tmp/iteag-streamfield-dom.html
