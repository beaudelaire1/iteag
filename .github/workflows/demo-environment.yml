name: Environnement de démonstration

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: demonstration-environment
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: demo-ci-secret-key-not-for-production
  DATABASE_URL: postgres://iteag:iteag_demo@localhost:5432/iteag_demo
  CELERY_BROKER_URL: redis://localhost:6379/0
  CELERY_RESULT_BACKEND: redis://localhost:6379/0
  CELERY_TASK_ALWAYS_EAGER: "True"
  CELERY_TASK_EAGER_PROPAGATES: "True"

jobs:
  validation-demonstration:
    name: Valider la version de démonstration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: demonstration
      url: https://t13h3q80c3cmb5zcw2kzlojy.137.74.169.188.sslip.io/
    defaults:
      run:
        working-directory: src

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iteag_demo
          POSTGRES_USER: iteag
          POSTGRES_PASSWORD: iteag_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iteag -d iteag_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements/dev.lock

      - name: Installer les dépendances Python verrouillées
        run: pip install --require-hashes -r requirements/dev.lock

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/package.json

      - name: Construire les ressources front-end
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Vérifier les migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Créer le schéma de démonstration
        run: python manage.py migrate --noinput

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Tester le parcours d'assiduité
        run: pytest apps/academics/test_assiduite.py -q

      - name: Vérifier la disponibilité publique
        working-directory: .
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            https://t13h3q80c3cmb5zcw2kzlojy.137.74.169.188.sslip.io/ \
            >/dev/null
