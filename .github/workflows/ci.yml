name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Même version que le verrou de développement : la CI ne change pas de
      # règles de style simplement parce qu'une nouvelle version de Ruff sort.
      - run: pip install ruff==0.16.1
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iteag_test
          POSTGRES_USER: iteag
          POSTGRES_PASSWORD: iteag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iteag -d iteag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements/dev.lock
      - run: pip install --require-hashes -r requirements/dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run tests
        env:
          DATABASE_URL: postgres://iteag:iteag_test@localhost:5432/iteag_test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest --cov=apps --cov-report=term --cov-report=xml -q
      - name: Vérifier les migrations
        env:
          DATABASE_URL: postgres://iteag:iteag_test@localhost:5432/iteag_test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py makemigrations --check --dry-run

  build:
    name: Build & production checks
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements/prod.lock
      - run: npm ci --no-audit --no-fund
      - name: Construire les assets comme en production
        run: |
          npm run build
          test -s static/css/main.css
          test -s static/js/vendor/hls.min.js
      - run: pip install --require-hashes -r requirements/prod.lock
      - name: Collecte des statiques (manifeste)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-collectstatic-key-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py collectstatic --noinput --clear
      - name: Vérifier la configuration de déploiement Django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-deploy-check-key-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
          AWS_ACCESS_KEY_ID: ci-r2-access
          AWS_SECRET_ACCESS_KEY: ci-r2-secret
          AWS_STORAGE_BUCKET_NAME: ci-media
          AWS_S3_ENDPOINT_URL: https://example.invalid
        run: python manage.py check --deploy --fail-level ERROR
      - name: Vérifier le fichier Compose de production
        env:
          DJANGO_SECRET_KEY: ci-compose-secret
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
          SITE_URL: https://localhost
          WAGTAILADMIN_BASE_URL: https://localhost
          POSTGRES_PASSWORD: ci-postgres-secret
        run: docker compose -f docker-compose.prod.yml config --quiet

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r requirements/prod.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - name: Auditer les dépendances Node
        run: npm audit --audit-level=high
