name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iteag_test
          POSTGRES_USER: iteag
          POSTGRES_PASSWORD: iteag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements/dev.lock
      # Le verrou, et non les intervalles : l'intégration continue teste
      # les versions exactes qui seront déployées.
      - run: pip install --require-hashes -r requirements/dev.lock
      # La suite vérifie que chaque « {% static %} » désigne un fichier livré.
      # Sans les bibliothèques tierces, elle échouerait sur une référence
      # pourtant valide en production. Elles sont construites plutôt que
      # versionnées : un fichier commité dériverait en silence de la version
      # épinglée dans package.json au premier changement de version.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      # « build » et non « vendor:build » : la feuille compilée est elle aussi
      # un artefact généré, et « base.html » la référence sur chaque page.
      - run: npm run build
      - name: Run tests
        env:
          DATABASE_URL: postgres://iteag:iteag_test@localhost:5432/iteag_test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest --cov=apps --cov-report=xml -q
      - name: Vérifier les migrations
        env:
          DATABASE_URL: postgres://iteag:iteag_test@localhost:5432/iteag_test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py makemigrations --check --dry-run
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          file: src/coverage.xml
          fail_ci_if_error: false

  build:
    name: Build assets
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements/prod.lock
      - run: npm install --no-audit --no-fund
      # « npm run build » et non « css:build » : c'est la commande qu'exécute
      # Dockerfile.prod. Vérifier autre chose que ce qui est déployé laisserait
      # passer une rupture de la copie des bibliothèques tierces.
      - name: Construire les assets comme en production
        run: |
          npm run build
          test -s static/css/main.css
          test -s static/js/vendor/hls.min.js
      - run: pip install --require-hashes -r requirements/prod.lock
      # Détecte au commit la rupture de chaîne qui, sinon, ne se voit qu'au
      # déploiement : référence statique non résolue, feuille absente.
      - name: Collecte des statiques (manifeste)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-collectstatic-key-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py collectstatic --noinput --clear

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      # Audité sur le verrou : ce sont ces versions-là qui partent en
      # production, transitives comprises — les intervalles n'en disent rien.
      - run: pip-audit -r requirements/prod.lock
