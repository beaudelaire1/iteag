# Qualification du baseline passif OWASP ZAP.
#
# Toute règle absente conserve le niveau WARN par défaut et fait échouer la CI.
# L'image ZAP épinglée compte OUTOFSCOPE comme WARN même lorsque toutes les
# instances sont exclues. Les règles qualifiées sont donc IGNORE ici, puis
# verifier_qualifications_zap.py refuse toute URL hors de la politique JSON.
# Les preuves vivent dans docs/exploitation/zap-baseline.md.

# Contenu public anonyme volontairement cacheable.
10015	IGNORE	(Re-examine Cache-control Directives)
10049	IGNORE	(Storable and Cacheable Content)

# Signaux purement descriptifs : application moderne, authentification et CSRF.
10109	IGNORE	(Modern Web Application)
10111	IGNORE	(Authentication Request Identified)
10112	IGNORE	(Session Management Response Identified)

# COEP/CORP ne peuvent pas être imposés tant que Turnstile est chargé dans les
# pages publiques depuis son origine dédiée.
90004	IGNORE	(Cross-Origin Embedder/Resource Policy)

# Jazzmin écrit ses initialisations en ligne uniquement dans l'admin Django.
10055	IGNORE	(CSP: script-src unsafe-inline)

# Les assets statiques publics ne manipulent ni session ni donnée personnelle.
10098	IGNORE	(Cross-Domain Misconfiguration)
10063	IGNORE	(Permissions Policy Header Not Set)
10027	IGNORE	(Information Disclosure - Suspicious Comments)
10110	IGNORE	(Dangerous JS Functions)

# Turnstile est un script dynamique Cloudflare : SRI n'est pas applicable.
10017	IGNORE	(Cross-Domain JavaScript Source File Inclusion)
90003	IGNORE	(Sub Resource Integrity Attribute Missing)

# Les valeurs liées sont réaffichées par les widgets Django auto-échappés.
10031	IGNORE	(User Controllable HTML Element Attribute - Potential XSS)
