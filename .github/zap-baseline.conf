# Qualification du baseline passif OWASP ZAP.
#
# Toute règle absente conserve le niveau WARN par défaut et fait échouer la CI.
# Les exclusions d'URL restent préférées à IGNORE afin qu'une même règle puisse
# encore détecter une régression sur une autre surface. Les preuves et les
# conditions de réexamen vivent dans docs/exploitation/zap-baseline.md.

# Contenu public anonyme volontairement cacheable.
10015	IGNORE	(Re-examine Cache-control Directives)
10049	IGNORE	(Storable and Cacheable Content)

# Signaux purement descriptifs : application moderne, authentification et CSRF.
10109	IGNORE	(Modern Web Application)
10111	IGNORE	(Authentication Request Identified)
10112	IGNORE	(Session Management Response Identified)

# COEP/CORP ne peuvent pas être imposés tant que Stripe et Turnstile sont
# chargés dans les pages publiques depuis leurs origines dédiées.
90004	IGNORE	(Cross-Origin Embedder/Resource Policy)

# Jazzmin écrit ses initialisations en ligne uniquement dans l'admin Django.
10055	OUTOFSCOPE	https://iteag-preprod\.137\.74\.169\.188\.sslip\.io/django-admin/.*

# Les assets statiques publics ne manipulent ni session ni donnée personnelle.
10098	OUTOFSCOPE	https://iteag-preprod\.137\.74\.169\.188\.sslip\.io/static/.*
10063	OUTOFSCOPE	https://iteag-preprod\.137\.74\.169\.188\.sslip\.io/static/.*
10027	OUTOFSCOPE	https://iteag-preprod\.137\.74\.169\.188\.sslip\.io/static/admin/js/vendor/jquery/.*
10110	OUTOFSCOPE	https://iteag-preprod\.137\.74\.169\.188\.sslip\.io/static/js/htmx\.min\..*\.js

