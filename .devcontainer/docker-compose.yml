services:
  app:
    build:
      context: ../src
      dockerfile: Dockerfile
    command: sleep infinity
    working_dir: /workspace/iteag
    volumes:
      - ../src:/workspace/iteag:cached
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: devcontainer-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,.app.github.dev
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,https://*.app.github.dev
      DJANGO_OTP_ENFORCE: "False"
      DATABASE_URL: postgres://iteag:iteag_dev@db:5432/iteag
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
      CELERY_TASK_EAGER_PROPAGATES: "True"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      SITE_URL: http://localhost:8000
      WAGTAILADMIN_BASE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iteag
      POSTGRES_USER: iteag
      POSTGRES_PASSWORD: iteag_dev
    volumes:
      - iteag_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iteag -d iteag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iteag_dev_postgres:
