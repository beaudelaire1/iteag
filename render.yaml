envVarGroups:
  - name: iteag-production
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: iteag.org,www.iteag.org,.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://iteag.org,https://www.iteag.org,https://*.onrender.com
      - key: SITE_URL
        value: https://iteag.org
      - key: WAGTAILADMIN_BASE_URL
        value: https://iteag.org
      - key: DATABASE_CONN_MAX_AGE
        value: "60"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DEFAULT_FROM_EMAIL
        value: secretariat@iteag.org
      - key: SERVER_EMAIL
        value: errors@iteag.org
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_S3_ADDRESSING_STYLE
        value: path
      - key: AWS_QUERYSTRING_EXPIRE
        value: "3600"
      - key: COMMERCE_SEUIL_LIVRAISON_OFFERTE
        value: "150.00"
      - key: CLOUDFLARE_TURNSTILE_TIMEOUT
        value: "5"
      - key: SENTRY_SEND_DEFAULT_PII
        value: "False"
      - key: SENTRY_ENABLE_LOGS
        value: "True"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: SENTRY_PROFILE_SESSION_SAMPLE_RATE
        value: "0.0"
      - key: SENTRY_PROFILE_LIFECYCLE
        value: trace
      - key: ELEARNING_DIFFUSION_VIDEO
        value: bunny
      - key: ELEARNING_DIFFUSION_PUBLIQUE
        value: youtube,vimeo
      - key: BUNNY_LIER_ADRESSE_IP
        value: "False"
      - key: DJANGO_OTP_ENFORCE
        value: "True"

services:
  - type: web
    name: iteag-web
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./src/Dockerfile.prod
    dockerContext: ./src
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    preDeployCommand: python manage.py migrate --noinput
    domains:
      - iteag.org
    envVars:
      - fromGroup: iteag-production
      - key: DATABASE_URL
        fromDatabase:
          name: iteag-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: iteag-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: iteag-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: iteag-redis
          property: connectionString
      - key: STRIPE_CLE_PUBLIABLE
        sync: false
      - key: STRIPE_CLE_SECRETE
        sync: false
      - key: STRIPE_SECRET_WEBHOOK
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CLOUDFLARE_TURNSTILE_SITE_KEY
        sync: false
      - key: CLOUDFLARE_TURNSTILE_SECRET_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: BUNNY_ZONE_DIFFUSION
        sync: false
      - key: BUNNY_CLE_SIGNATURE
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: COMMERCE_ALERTE_EMAIL
        sync: false

  - type: worker
    name: iteag-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./src/Dockerfile.prod
    dockerContext: ./src
    autoDeployTrigger: checksPass
    dockerCommand: celery -A config worker --beat --loglevel=info --concurrency=2
    envVars:
      - fromGroup: iteag-production
      - key: DATABASE_URL
        fromDatabase:
          name: iteag-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: iteag-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: iteag-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: iteag-redis
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: BUNNY_ZONE_DIFFUSION
        sync: false
      - key: BUNNY_CLE_SIGNATURE
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: keyvalue
    name: iteag-redis
    region: frankfurt
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: iteag-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: iteag
    user: iteag
    ipAllowList: []
