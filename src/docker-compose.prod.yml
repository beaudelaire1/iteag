# ITEAG — Déploiement Coolify
# Chemin : src/docker-compose.prod.yml

x-application: &application
  build:
    context: .
    dockerfile: Dockerfile.prod

  # Coolify dépose un « .env » à côté de ce fichier à partir des variables
  # saisies dans sa fiche, et les injecte aussi dans l'environnement. Le
  # fichier n'est donc pas la seule source : le rendre facultatif évite qu'un
  # déploiement échoue sur son absence alors que toutes les valeurs sont là.
  env_file:
    - path: .env
      required: false

  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY doit être défini}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS doit être défini}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS doit être défini}
    SESSION_REFRESH_INTERVAL: ${SESSION_REFRESH_INTERVAL:-300}

    SITE_URL: ${SITE_URL:?SITE_URL doit être défini}
    WAGTAILADMIN_BASE_URL: ${WAGTAILADMIN_BASE_URL:?WAGTAILADMIN_BASE_URL doit être défini}
    # Dans Coolify, définir ITEAG_REVISION avec la valeur « $SOURCE_COMMIT ».
    # SOURCE_COMMIT est prédéfini par Coolify ; on ne le redéclare pas dans le
    # Compose, car cela peut créer une variable éditable vide qui masque la
    # valeur prédéfinie. Une stack sans révision identifiable ne démarre plus.
    ITEAG_REVISION: ${ITEAG_REVISION:?ITEAG_REVISION doit référencer $SOURCE_COMMIT dans Coolify}

    DATABASE_URL: "postgresql://${POSTGRES_USER:-iteag}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-iteag}"

    REDIS_URL: "redis://redis:6379/0"
    CELERY_BROKER_URL: "redis://redis:6379/1"
    CELERY_RESULT_BACKEND: "redis://redis:6379/2"
    CELERY_TASK_ALWAYS_EAGER: "False"

    # Aucun backend de développement n'est accepté silencieusement dans la
    # pile de production : une notification non envoyée est une panne métier.
    EMAIL_BACKEND: ${EMAIL_BACKEND:?EMAIL_BACKEND doit être défini}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL doit être défini}
    SERVER_EMAIL: ${SERVER_EMAIL:?SERVER_EMAIL doit être défini}
    EMAIL_HOST: ${EMAIL_HOST:?EMAIL_HOST doit être défini}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:?EMAIL_HOST_USER doit être défini}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?EMAIL_HOST_PASSWORD doit être défini}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
    EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
    EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}

    # Protection des formulaires publics : les clés sont obligatoires dans la
    # stack de production et `verifier_production` refuse explicitement False.
    CLOUDFLARE_TURNSTILE_ENABLED: ${CLOUDFLARE_TURNSTILE_ENABLED:?CLOUDFLARE_TURNSTILE_ENABLED doit être défini}
    CLOUDFLARE_TURNSTILE_SITE_KEY: ${CLOUDFLARE_TURNSTILE_SITE_KEY:?CLOUDFLARE_TURNSTILE_SITE_KEY doit être défini}
    CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:?CLOUDFLARE_TURNSTILE_SECRET_KEY doit être défini}
    CLOUDFLARE_TURNSTILE_TIMEOUT: ${CLOUDFLARE_TURNSTILE_TIMEOUT:-5}

    # Médias privés Cloudflare R2.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID doit être défini}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY doit être défini}
    AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:?AWS_STORAGE_BUCKET_NAME doit être défini}
    AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:?AWS_S3_ENDPOINT_URL doit être défini}
    AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-auto}
    AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-path}
    AWS_QUERYSTRING_EXPIRE: ${AWS_QUERYSTRING_EXPIRE:-3600}

    # Observabilité : une production sans remontée d'exception ne doit pas être
    # considérée comme prête.
    SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN doit être défini}
    SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-False}
    SENTRY_ENABLE_LOGS: ${SENTRY_ENABLE_LOGS:-True}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    SENTRY_PROFILE_SESSION_SAMPLE_RATE: ${SENTRY_PROFILE_SESSION_SAMPLE_RATE:-0.0}
    SENTRY_PROFILE_LIFECYCLE: ${SENTRY_PROFILE_LIFECYCLE:-trace}

    # Diffusion vidéo protégée.
    ELEARNING_DIFFUSION_VIDEO: ${ELEARNING_DIFFUSION_VIDEO:-bunny}
    ELEARNING_DIFFUSION_PUBLIQUE: ${ELEARNING_DIFFUSION_PUBLIQUE:-youtube,vimeo}
    BUNNY_ZONE_DIFFUSION: ${BUNNY_ZONE_DIFFUSION:?BUNNY_ZONE_DIFFUSION doit être défini}
    BUNNY_CLE_SIGNATURE: ${BUNNY_CLE_SIGNATURE:?BUNNY_CLE_SIGNATURE doit être défini}
    BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID:?BUNNY_STREAM_LIBRARY_ID doit être défini}
    BUNNY_STREAM_API_KEY: ${BUNNY_STREAM_API_KEY:?BUNNY_STREAM_API_KEY doit être défini}
    BUNNY_LIER_ADRESSE_IP: ${BUNNY_LIER_ADRESSE_IP:-False}

  restart: unless-stopped

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iteag}
      POSTGRES_USER: ${POSTGRES_USER:-iteag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-iteag} -d ${POSTGRES_DB:-iteag}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped
    mem_limit: 2g

  # Sauvegarde indépendante du volume postgres_data : pg_dump se connecte à
  # PostgreSQL puis le dump quitte immédiatement le serveur vers un bucket R2
  # dédié. Une production ouverte au public doit disposer de ces identifiants :
  # la sauvegarde n'est plus un composant optionnel de cette stack.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup

    env_file:
      - path: .env
        required: false

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-iteag}
      POSTGRES_USER: ${POSTGRES_USER:-iteag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini}

      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_R2_ENDPOINT_URL: ${BACKUP_R2_ENDPOINT_URL:?BACKUP_R2_ENDPOINT_URL doit être défini}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:?BACKUP_R2_ACCESS_KEY_ID doit être défini}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:?BACKUP_R2_SECRET_ACCESS_KEY doit être défini}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-iteag-backups}
      BACKUP_R2_REGION: ${BACKUP_R2_REGION:-auto}
      BACKUP_R2_PREFIX: ${BACKUP_R2_PREFIX:-postgres}

      # 03:00 en Guyane. Une sauvegarde est également lancée au démarrage du
      # conteneur, ce qui valide le compte R2 pendant le déploiement.
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-America/Cayenne}
      BACKUP_HOUR_LOCAL: ${BACKUP_HOUR_LOCAL:-3}
      BACKUP_MINUTE_LOCAL: ${BACKUP_MINUTE_LOCAL:-0}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-true}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-3600}

      # 35 quotidiens et environ 12 mensuels.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      BACKUP_MONTHLY_RETENTION_DAYS: ${BACKUP_MONTHLY_RETENTION_DAYS:-400}

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped
    mem_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped
    mem_limit: 512m

  migrate:
    <<: *application

    command:
      - python
      - manage.py
      - migrate
      - --noinput

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: "no"
    mem_limit: 1g

    healthcheck:
      disable: true

  web:
    <<: *application

    expose:
      - "8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    mem_limit: 2g

  worker:
    <<: *application

    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --concurrency=2
      - --max-tasks-per-child=1000

    depends_on:
      migrate:
        condition: service_completed_successfully

    mem_limit: 2g

    healthcheck:
      test:
        - CMD-SHELL
        - celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  beat:
    <<: *application

    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule

    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy

    mem_limit: 256m

    # Le heartbeat est planifié par Beat puis exécuté par le worker. S'il cesse
    # d'être renouvelé, Beat est redémarré sans déclarer le site web en panne.
    healthcheck:
      test:
        - CMD
        - python
        - manage.py
        - verifier_heartbeat_celery
        - --max-age
        - "180"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  postgres_data:
  redis_data:
