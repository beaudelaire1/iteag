[project]
name = "iteag"
version = "1.0.0"
description = "Plateforme académique et institutionnelle de l'ITEAG — Django / Wagtail"
requires-python = ">=3.12"
license = {text = "Proprietary — Trait d'Union Studio"}
authors = [
    {name = "Beaudelaire VILME", email = "contact@traitdunion.it"},
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["apps", "config"]

[tool.ruff.lint]
# PLW1514 : lire un fichier sans encodage explicite. Sous Windows, Python
# retombe alors sur cp1252 et lève UnicodeDecodeError au premier caractère
# accentué — ce qui est fatal sur un projet dont les gabarits et les feuilles
# de style sont en français. Le défaut ne se voit pas sous Linux, donc ni en
# développement ici, ni en intégration continue : seul le poste d'un
# collègue le révèle.
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "PLW1514"]
ignore = ["S101", "DJ001"]
# PLW1514 n'est encore proposée qu'en avant-première. « explicit-preview-rules »
# n'active que celles qui sont nommées ci-dessus : le reste de l'avant-première
# ne s'invite pas dans le projet.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# Les jeux d'essai manipulent des mots de passe factices : l'alerte n'a pas de sens ici.
"**/tests.py" = ["S105", "S106"]
"**/test_*.py" = ["S105", "S106"]
"conftest.py" = ["S105", "S106"]
# Clé de signature non secrète, réservée à l'exécution des tests.
"config/settings/test.py" = ["S105"]
# Les migrations sont générées : elles ne sont pas soumises au style du projet.
"**/migrations/*.py" = ["E501"]
# Contenus éditoriaux portés par du code (descriptions de cours, biographies,
# versets). Découper cette prose nuirait à sa relecture par l'ITEAG.
"**/management/commands/seed_*.py" = ["E501"]
"apps/core/templatetags/iteag_tags.py" = ["E501"]
# Le conteneur de sauvegarde invoque volontairement les clients PostgreSQL et
# son propre script avec des listes d'arguments entièrement contrôlées, jamais
# avec une commande reçue d'un utilisateur ni avec shell=True.
"scripts/postgres_backup_*.py" = ["S404", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q --no-header"
filterwarnings = [
    "ignore::DeprecationWarning",
    # Une liste paginée sans tri explicite peut répéter ou omettre des lignes
    # d'une page à l'autre : sans ORDER BY, PostgreSQL ne garantit aucun ordre
    # stable entre deux requêtes. C'est invisible en développement, où les
    # tables tiennent sur une page, et faux en production. On échoue plutôt que
    # d'avertir.
    "error::django.core.paginator.UnorderedObjectListWarning",
]
