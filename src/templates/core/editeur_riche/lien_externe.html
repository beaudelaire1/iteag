{% load i18n wagtailadmin_tags %}
{% include "wagtailadmin/shared/header.html" with title="Insérer un lien" %}

<div class="nice-padding editeur-lien-portail">
    <form action="{{ request.path }}" method="post" novalidate>
        {% csrf_token %}
        <ul class="fields">
            {% for field in form %}
                <li>{% formattedfield field %}</li>
            {% endfor %}
            <li><input type="submit" value="Insérer le lien" class="button" /></li>
        </ul>
    </form>
</div>
