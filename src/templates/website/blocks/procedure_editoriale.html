{% load wagtailcore_tags %}
<section class="my-8" aria-label="{% if value.titre %}{{ value.titre }}{% else %}Procédure{% endif %}">
    {% if value.titre %}<h2 class="text-xl font-bold mb-5 text-navy-900">{{ value.titre }}</h2>{% endif %}
    <ol class="space-y-5">
        {% for etape in value.etapes %}
        <li class="flex gap-4">
            <span class="shrink-0 flex h-8 w-8 items-center justify-center rounded-full text-sm font-bold bg-navy-800 text-white"
                 >{{ forloop.counter }}</span>
            <div class="min-w-0 pt-0.5">
                <h3 class="font-semibold text-navy-900">{{ etape.titre }}</h3>
                <div class="contenu-riche mt-1 text-sm text-warm-700">{{ etape.description|richtext }}</div>
            </div>
        </li>
        {% endfor %}
    </ol>
</section>
