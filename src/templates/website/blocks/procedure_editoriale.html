{% load wagtailcore_tags %}
<section class="my-8" aria-label="{% if value.titre %}{{ value.titre }}{% else %}Procédure{% endif %}">
    {% if value.titre %}<h2 class="text-xl font-bold mb-5 csp-style-a4a1aa46c7f2">{{ value.titre }}</h2>{% endif %}
    <ol class="space-y-5">
        {% for etape in value.etapes %}
        <li class="flex gap-4">
            <span class="shrink-0 flex h-8 w-8 items-center justify-center rounded-full text-sm font-bold csp-style-0e87db1b4c7b"
                 >{{ forloop.counter }}</span>
            <div class="min-w-0 pt-0.5">
                <h3 class="font-semibold csp-style-a4a1aa46c7f2">{{ etape.titre }}</h3>
                <div class="contenu-riche mt-1 text-sm csp-style-81372cea588f">{{ etape.description|richtext }}</div>
            </div>
        </li>
        {% endfor %}
    </ol>
</section>
