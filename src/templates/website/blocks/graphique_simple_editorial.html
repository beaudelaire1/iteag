<figure class="my-8 rounded-xl border p-5 sm:p-6 csp-style-2998f592f360">
    <figcaption class="text-lg font-bold mb-5 csp-style-a4a1aa46c7f2">{{ value.titre }}</figcaption>
    <div class="space-y-4">
        {% for item in barres %}
        <div>
            <div class="flex items-baseline justify-between gap-4 text-sm">
                <span class="font-medium csp-style-81372cea588f">{{ item.libelle }}</span>
                <span class="csp-style-9bce6c04a80b">{{ item.valeur }}{% if value.unite %} {{ value.unite }}{% endif %}</span>
            </div>
            <div class="mt-1.5 h-2.5 overflow-hidden rounded-full csp-style-1b6944c17eba" aria-hidden="true">
                <div class="h-full rounded-full" data-progress-width="{{ item.pourcentage }}"></div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% if value.source %}<p class="mt-5 text-xs csp-style-25e866ad732d">Source : {{ value.source }}</p>{% endif %}
</figure>
