<section class="my-8 rounded-xl p-5 sm:p-6 bg-warm-100">
    {% if value.titre %}<h2 class="text-xl font-bold mb-5 text-navy-900">{{ value.titre }}</h2>{% endif %}
    <dl class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
        {% for item in value.elements %}
        <div>
            <dd class="text-2xl font-bold text-navy-800">{{ item.valeur }}</dd>
            <dt class="mt-1 font-medium text-warm-700">{{ item.libelle }}</dt>
            {% if item.precision %}<p class="mt-1 text-sm text-warm-500">{{ item.precision }}</p>{% endif %}
        </div>
        {% endfor %}
    </dl>
</section>
