{% load wagtailcore_tags %}
<div class="my-8 overflow-x-auto rounded-lg border" style="border-color: var(--color-warm-200);">
    <table class="w-full min-w-[36rem] border-collapse text-sm">
        {% if value.columns %}
        <thead style="background: var(--color-warm-100);">
            <tr>
                {% for colonne in value.columns %}
                <th scope="col" class="px-4 py-3 text-left font-semibold" style="color: var(--color-navy-900);">
                    {{ colonne.heading }}
                </th>
                {% endfor %}
            </tr>
        </thead>
        {% endif %}
        <tbody>
            {% for ligne in value.rows %}
            <tr class="border-t" style="border-color: var(--color-warm-200);">
                {% for cellule in ligne %}
                <td class="px-4 py-3 align-top" style="color: var(--color-warm-700);">{% include_block cellule %}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
