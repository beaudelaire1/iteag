{% extends "base.html" %}
{% load static %}

{% block title %}Message envoyé — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="relative overflow-hidden csp-style-7718c54aec98">
    <div class="absolute inset-0 opacity-[0.04] csp-style-67ff139fd07f"></div>
    <div class="container-narrow text-center relative hero-entrance">
        <div class="mx-auto h-20 w-20 flex items-center justify-center rounded-full mb-8 hero-el hero-el-1 csp-style-77b8a1c07faa">

    </div>
