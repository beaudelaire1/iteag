# ═══════════════════════════════════════════════════════════════
# ITEAG — Nginx virtual host (iteag.org)
#
# ⚠️  CE FICHIER N'EST PAS SERVI EN PRODUCTION.
#
# Coolify/Traefik assure la terminaison TLS et le routage. Ce fichier n'est
# monté par aucun Compose : les en-têtes de sécurité réellement émis viennent
# de Django (`apps/core/middleware.py`, `config/settings/prod.py`).
#
# Lire nginx/README.md avant toute modification.
# ═══════════════════════════════════════════════════════════════

# Upstream Django / Gunicorn
upstream django {
    server web:8000;
}

# ── Redirection HTTP → HTTPS + challenge ACME ──
server {
    listen 80;
    listen [::]:80;
    server_name iteag.org www.iteag.org;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check Nginx (utilisé par le healthcheck Docker)
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — serveur principal ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name iteag.org www.iteag.org;

    # ── Certificats SSL (Let's Encrypt) ──
    ssl_certificate     /etc/letsencrypt/live/iteag.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iteag.org/privkey.pem;

    # ── Paramètres SSL robustes ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── En-têtes de sécurité ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Fichiers statiques (servis par Nginx, cachés longtemps) ──
    location /static/ {
        alias /var/www/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Fichiers médias uploadés ──
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Favicon et robots ──
    location = /favicon.ico {
        alias /var/www/staticfiles/favicon/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias /var/www/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }

    # ── Proxy vers Django / Gunicorn ──
    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # ── Health check Nginx ──
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
